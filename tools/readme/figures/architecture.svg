<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d">
<title id="t">Doer and checker architecture</title>
<desc id="d">Sensors feed Autoware, rated QM, which sends its commands through an independent safety monitor, ASIL D and not built yet, to the vehicle drive-by-wire, ASIL D required of the supplier. Remote operations, ASIL C, also send their commands through the monitor. The monitor has its own sensors. Below, the concept work products with their status in the register; they feed the UL 4600 safety case.</desc>
<style>
svg{--bg:#ffffff;--ink:#14171c;--ink2:#4b525c;--ink3:#868d97;--line:#c9ced6;--card:#f5f6f8;--acc:#2d55c8;--accsoft:#e7ecfb;--case:#0f7d73;--casesoft:#e2f5f2;--amb:#a86d00;--ambsoft:#fbf0d6;--red:#b3261e;--redsoft:#fbe5e2}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--ink:#eceef1;--ink2:#b9bfc8;--ink3:#7f8792;--line:#3a404a;--card:#161b22;--acc:#86a2ff;--accsoft:#1e2742;--case:#4fd1c1;--casesoft:#123330;--amb:#e7a52a;--ambsoft:#3a2e14;--red:#ff8b80;--redsoft:#3d1c1a}}
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
.h{font-size:15px;font-weight:600} .t{font-size:12.5px;fill:var(--ink2)} .s{font-size:11px;fill:var(--ink3)}
.b{font-size:12px;font-weight:600} .chip{font-size:11px;font-weight:700}
.card{fill:var(--card);stroke:var(--line);stroke-width:1}
.mon{fill:var(--accsoft);stroke:var(--acc);stroke-width:1.5;stroke-dasharray:6 4}
.case{fill:var(--casesoft);stroke:var(--case);stroke-width:1.5}
.bnd{fill:none;stroke:var(--ink3);stroke-width:1;stroke-dasharray:4 4}
.arr{stroke:var(--ink2);stroke-width:1.6;fill:none;marker-end:url(#a)}
.arr2{stroke:var(--acc);stroke-width:1.4;fill:none;marker-end:url(#a2);stroke-dasharray:3 3}
.qm{fill:var(--card);stroke:var(--ink3)} .d{fill:var(--redsoft);stroke:var(--red)} .c{fill:var(--ambsoft);stroke:var(--amb)}
.qmt{fill:var(--ink2)} .dt{fill:var(--red)} .ct{fill:var(--amb)}
.wp{fill:var(--bg);stroke:var(--line)}
.st-D{fill:var(--amb)} .st-S{fill:none;stroke:var(--ink3);stroke-dasharray:2 1.5} .st-R{fill:none;stroke:var(--amb);stroke-width:1.5}
.st-A{fill:#23875a} .st-B{fill:#23875a;stroke:var(--ink);stroke-width:1.2}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink2)"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--acc)"/></marker></defs>
<rect width="900" height="470" rx="10" fill="var(--bg)" stroke="var(--line)"/>
<text x="24" y="34" class="h">Doer and checker: how the driverless system is built</text>
<text x="24" y="54" class="t">Autoware drives. An independent safety monitor checks every command and can stop the vehicle on its own.</text>
<rect x="16" y="120" width="616" height="186" rx="12" class="bnd"/>
<text x="28" y="137" class="s">THE ITEM (WP-C-01)</text>
<rect x="30" y="148" width="158" height="112" rx="8" class="card"/>
<text x="42" y="170" class="b">Sensors</text>
<text x="42" y="190" class="s">LiDAR, camera, radar,</text>
<text x="42" y="206" class="s">GNSS, IMU for Autoware</text>
<text x="42" y="222" class="s">+ the monitor's own set</text>
<text x="42" y="238" class="s">(DQ-018 A)</text>
<rect x="210" y="148" width="180" height="112" rx="8" class="card"/>
<text x="222" y="170" class="b">Autoware</text>
<text x="222" y="190" class="s">Perceives, plans, controls</text>
<text x="222" y="206" class="s">Unmodified upstream,</text>
<text x="222" y="222" class="s">pinned in autoware.repos</text>
<rect x="222" y="232" width="30" height="20" rx="10" class="qm"/>
<text x="237" y="246" class="chip qmt" text-anchor="middle">QM</text>
<rect x="420" y="148" width="196" height="112" rx="8" class="mon"/>
<text x="432" y="170" class="b">Safety monitor</text>
<text x="432" y="190" class="s">Own hardware and sensors</text>
<text x="432" y="206" class="s">Checks commands against</text>
<text x="432" y="222" class="s">a safety envelope</text>
<rect x="432" y="232" width="58" height="20" rx="10" class="d"/>
<text x="461" y="246" class="chip dt" text-anchor="middle">ASIL D</text>
<text x="604" y="250" class="s" text-anchor="end">not built yet</text>
<rect x="670" y="148" width="210" height="112" rx="8" class="card"/>
<text x="682" y="170" class="b">Vehicle drive-by-wire</text>
<text x="682" y="190" class="s">Brakes, steering, propulsion</text>
<text x="682" y="206" class="s">Outside the item;</text>
<text x="682" y="222" class="s">vehicle chosen at G2</text>
<rect x="682" y="232" width="58" height="20" rx="10" class="d"/>
<text x="711" y="246" class="chip dt" text-anchor="middle">ASIL D</text>
<text x="868" y="276" class="s" text-anchor="end">required of the supplier (AOU-01)</text>
<rect x="420" y="72" width="196" height="36" rx="8" class="card"/>
<text x="432" y="94" class="b">Remote operations</text>
<rect x="544" y="80" width="58" height="20" rx="10" class="c"/>
<text x="573" y="94" class="chip ct" text-anchor="middle">ASIL C</text>
<path d="M188,204 L208,204" class="arr"/>
<path d="M390,204 L418,204" class="arr"/>
<path d="M616,204 L668,204" class="arr"/>
<path d="M518,108 L518,146" class="arr"/>
<path d="M105,262 C105,292 518,292 518,264" class="arr2"/>
<text x="312" y="298" class="s" text-anchor="middle">independent sensing path, not through Autoware</text>
<rect x="16" y="322" width="868" height="132" rx="12" class="case"/>
<text x="28" y="344" class="s">ASSURANCE: the concept work products, with their status in WP-M-00</text>
<rect x="28" y="356" width="98" height="52" rx="6" class="wp"/>
<text x="77" y="374" class="b" text-anchor="middle">Item</text>
<text x="77" y="389" class="s" text-anchor="middle">WP-C-01</text>
<rect x="50" y="395" width="8" height="8" rx="2" class="st-D"/>
<text x="62" y="403" class="s">Draft</text>
<rect x="134" y="356" width="98" height="52" rx="6" class="wp"/>
<text x="183" y="374" class="b" text-anchor="middle">ODD</text>
<text x="183" y="389" class="s" text-anchor="middle">WP-C-02</text>
<rect x="156" y="395" width="8" height="8" rx="2" class="st-D"/>
<text x="168" y="403" class="s">Draft</text>
<rect x="240" y="356" width="98" height="52" rx="6" class="wp"/>
<text x="289" y="374" class="b" text-anchor="middle">HARA</text>
<text x="289" y="389" class="s" text-anchor="middle">WP-C-03</text>
<rect x="262" y="395" width="8" height="8" rx="2" class="st-D"/>
<text x="274" y="403" class="s">Draft</text>
<rect x="346" y="356" width="98" height="52" rx="6" class="wp"/>
<text x="395" y="374" class="b" text-anchor="middle">Safety concept</text>
<text x="395" y="389" class="s" text-anchor="middle">WP-C-04</text>
<rect x="368" y="395" width="8" height="8" rx="2" class="st-D"/>
<text x="380" y="403" class="s">Draft</text>
<rect x="452" y="356" width="98" height="52" rx="6" class="wp"/>
<text x="501" y="374" class="b" text-anchor="middle">SOTIF</text>
<text x="501" y="389" class="s" text-anchor="middle">WP-C-05</text>
<rect x="474" y="395" width="8" height="8" rx="2" class="st-D"/>
<text x="486" y="403" class="s">Draft</text>
<rect x="558" y="356" width="98" height="52" rx="6" class="wp"/>
<text x="607" y="374" class="b" text-anchor="middle">Cybersecurity</text>
<text x="607" y="389" class="s" text-anchor="middle">WP-C-09</text>
<rect x="580" y="395" width="8" height="8" rx="2" class="st-D"/>
<text x="592" y="403" class="s">Draft</text>
<rect x="664" y="356" width="98" height="52" rx="6" class="wp"/>
<text x="713" y="374" class="b" text-anchor="middle">AI safety</text>
<text x="713" y="389" class="s" text-anchor="middle">WP-C-11</text>
<rect x="686" y="395" width="8" height="8" rx="2" class="st-S"/>
<text x="698" y="403" class="s">Skeleton</text>
<rect x="770" y="356" width="98" height="52" rx="6" class="wp"/>
<text x="819" y="374" class="b" text-anchor="middle">Fallback</text>
<text x="819" y="389" class="s" text-anchor="middle">WP-C-12</text>
<rect x="792" y="395" width="8" height="8" rx="2" class="st-D"/>
<text x="804" y="403" class="s">Draft</text>
<text x="450" y="438" class="t" text-anchor="middle">all feed the UL 4600 safety case, WP-K-01 (skeleton)</text>
</svg>
