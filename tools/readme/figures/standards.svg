<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-labelledby="t d">
<title id="t">Standards map</title>
<desc id="d">UL 4600 is the safety case. Five frameworks feed evidence into it: ISO 26262, malfunctions, ASILs; ISO 21448, performance limits; ISO/SAE 21434, remote link, updates; ISO/PAS 8800, perception models, data; Automotive SPICE 4.0, engineering processes. As set out in WP-M-01 §4.</desc>
<style>
svg{--bg:#ffffff;--ink:#14171c;--ink2:#4b525c;--ink3:#868d97;--line:#c9ced6;--card:#f5f6f8;--acc:#2d55c8;--accsoft:#e7ecfb;--case:#0f7d73;--casesoft:#e2f5f2;--amb:#a86d00;--ambsoft:#fbf0d6;--red:#b3261e;--redsoft:#fbe5e2}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--ink:#eceef1;--ink2:#b9bfc8;--ink3:#7f8792;--line:#3a404a;--card:#161b22;--acc:#86a2ff;--accsoft:#1e2742;--case:#4fd1c1;--casesoft:#123330;--amb:#e7a52a;--ambsoft:#3a2e14;--red:#ff8b80;--redsoft:#3d1c1a}}
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
.h{font-size:15px;font-weight:600} .t{font-size:12.5px;fill:var(--ink2)} .s{font-size:11px;fill:var(--ink3)}
.b{font-size:12px;font-weight:600} .chip{font-size:11px;font-weight:700}
.card{fill:var(--card);stroke:var(--line);stroke-width:1}
.mon{fill:var(--accsoft);stroke:var(--acc);stroke-width:1.5;stroke-dasharray:6 4}
.case{fill:var(--casesoft);stroke:var(--case);stroke-width:1.5}
.bnd{fill:none;stroke:var(--ink3);stroke-width:1;stroke-dasharray:4 4}
.arr{stroke:var(--ink2);stroke-width:1.6;fill:none;marker-end:url(#a)}
.arr2{stroke:var(--acc);stroke-width:1.4;fill:none;marker-end:url(#a2);stroke-dasharray:3 3}
.qm{fill:var(--card);stroke:var(--ink3)} .d{fill:var(--redsoft);stroke:var(--red)} .c{fill:var(--ambsoft);stroke:var(--amb)}
.qmt{fill:var(--ink2)} .dt{fill:var(--red)} .ct{fill:var(--amb)}
.wp{fill:var(--bg);stroke:var(--line)}
.st-D{fill:var(--amb)} .st-S{fill:none;stroke:var(--ink3);stroke-dasharray:2 1.5} .st-R{fill:none;stroke:var(--amb);stroke-width:1.5}
.st-A{fill:#23875a} .st-B{fill:#23875a;stroke:var(--ink);stroke-width:1.2}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink2)"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--acc)"/></marker></defs>
<rect width="900" height="250" rx="10" fill="var(--bg)" stroke="var(--line)"/>
<text x="24" y="34" class="h">One safety case, five sources of evidence</text>
<rect x="24" y="52" width="852" height="58" rx="10" class="case"/>
<text x="450" y="76" class="b" text-anchor="middle">UL 4600 · the safety case</text>
<text x="450" y="96" class="t" text-anchor="middle">Is the driverless system acceptably safe across its whole ODD and lifecycle, with no driver to fall back on?</text>
<rect x="24" y="150" width="162" height="78" rx="8" class="card"/>
<text x="105" y="174" class="b" text-anchor="middle">ISO 26262</text>
<text x="105" y="194" class="t" text-anchor="middle">What if it fails?</text>
<text x="105" y="212" class="s" text-anchor="middle">malfunctions, ASILs</text>
<path d="M105,148 L105,114" class="arr"/>
<rect x="196" y="150" width="162" height="78" rx="8" class="card"/>
<text x="277" y="174" class="b" text-anchor="middle">ISO 21448</text>
<text x="277" y="194" class="t" text-anchor="middle">Is it good enough?</text>
<text x="277" y="212" class="s" text-anchor="middle">performance limits</text>
<path d="M277,148 L277,114" class="arr"/>
<rect x="368" y="150" width="162" height="78" rx="8" class="card"/>
<text x="449" y="174" class="b" text-anchor="middle">ISO/SAE 21434</text>
<text x="449" y="194" class="t" text-anchor="middle">What if it's attacked?</text>
<text x="449" y="212" class="s" text-anchor="middle">remote link, updates</text>
<path d="M449,148 L449,114" class="arr"/>
<rect x="540" y="150" width="162" height="78" rx="8" class="card"/>
<text x="621" y="174" class="b" text-anchor="middle">ISO/PAS 8800</text>
<text x="621" y="194" class="t" text-anchor="middle">Can the ML be trusted?</text>
<text x="621" y="212" class="s" text-anchor="middle">perception models, data</text>
<path d="M621,148 L621,114" class="arr"/>
<rect x="712" y="150" width="162" height="78" rx="8" class="card"/>
<text x="793" y="174" class="b" text-anchor="middle">ASPICE 4.0</text>
<text x="793" y="194" class="t" text-anchor="middle">Is the process capable?</text>
<text x="793" y="212" class="s" text-anchor="middle">engineering processes</text>
<path d="M793,148 L793,114" class="arr"/>
<text x="876" y="136" class="s" text-anchor="end">evidence</text>
</svg>
