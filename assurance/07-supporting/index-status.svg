<title id="t">07-supporting: work products by gate and status</title>
<desc id="d">Work products of 07-supporting from WP-M-00 §3, with the gates they are needed for and their status: WP-P-01 Configuration management plan (baselines, .repos pins, safety-relevant paths): G0, Skeleton; WP-P-02 Change management plan: G0, Skeleton; WP-P-03 Problem resolution management: G0, Skeleton; WP-P-04 Documentation management: G0, Skeleton; WP-P-05 Verification and review procedure: G0, Skeleton; WP-P-06 Requirements management and traceability procedure: G0, Skeleton; WP-P-07 Software tool classification and qualification (including simulators): G3, Skeleton; WP-P-08 Software components not developed to ISO 26262 (Autoware packages, ROS 2, middleware, OS): G3, Skeleton; WP-P-09 Proven-in-use argument evaluation: G3, Skeleton; WP-P-10 Release management and baseline procedure: G5, Skeleton.</desc>
