<title id="t">09-production-operation: work products by gate and status</title>
<desc id="d">Work products of 09-production-operation from WP-M-00 §3, with the gates they are needed for and their status: WP-O-01 Production, installation and provisioning control: G5, Skeleton; WP-O-02 Fleet operation, service, sensor calibration and decommissioning: G5, Skeleton; WP-O-03 Information for passengers, fleet operators and first responders: G5, Skeleton; WP-O-04 Field monitoring and incident reporting: G6, Skeleton; WP-O-05 Cybersecurity incident response, vulnerability management and updates: G6, Skeleton; WP-O-06 Safety performance indicators (definition and monitoring): G2 (definition), G6 (monitoring), Skeleton.</desc>
