svg .st-d { fill:var(--amb); }
svg .st-r { fill:var(--ambsoft); stroke:var(--amb); stroke-width:1.5; }
svg .st-a { fill:var(--ok); } svg .st-b { fill:var(--ok); stroke:var(--ink); stroke-width:1.6; }
svg .st-na { fill:var(--bg); stroke:var(--grid); stroke-width:1.2; stroke-dasharray:2 2; }
svg .concept { fill:var(--ok); } svg .new { fill:var(--accsoft); stroke:var(--acc); stroke-width:1.4; }
svg .pending { fill:var(--ambsoft); stroke:var(--amb); stroke-width:1.4; stroke-dasharray:4 2; }
svg .chip { font:600 11px ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill:var(--ink); }
svg .chipi { font:600 11px ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill:var(--bg); }
