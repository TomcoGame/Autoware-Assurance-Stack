<svg xmlns="http://www.w3.org/2000/svg" width="640" height="570" viewBox="0 0 640 570" role="img" aria-labelledby="t d">
<title id="t">WP-C-06 Figure 5-1: triggering conditions by hazard</title>
<desc id="d">Number of triggering conditions of each kind that can lead to each SOTIF hazard: SH-01: Environment 4, Road and map 2, Road users 3, Vehicle and sensors 2; SH-02: Environment 4, Road users 2, Vehicle and sensors 1; SH-03: Environment 2, Road and map 1; SH-04: Road and map 4, Road users 3; SH-05: Environment 1, Road and map 2, Road users 4; SH-06: Road and map 2, Vehicle and sensors 1; SH-07: Road and map 1; SH-08: Environment 1; SH-09: Road users 1; SH-10: Road users 1; SH-11: Road users 1; SH-12: Road and map 4, Road users 3; SH-13: Operations 2; SH-14: Environment 4, Road users 1, Vehicle and sensors 1; SH-15: Road and map 1; SH-16: Operations 1.</desc>
