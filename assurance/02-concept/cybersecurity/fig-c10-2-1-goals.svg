<svg xmlns="http://www.w3.org/2000/svg" width="640" height="538" viewBox="0 0 640 538" role="img" aria-labelledby="t d">
<title id="t">WP-C-10 Figure 2-1: threats, goals and requirements</title>
<desc id="d">Goals: CG-01 (CAL4) from TS-01, TS-02, TS-03; CG-02 (CAL4) from TS-04; CG-03 (CAL3) from TS-07; CG-04 (CAL4) from TS-08, TS-09, TS-10; CG-05 (CAL4) from TS-12; CG-06 (CAL4) from TS-14; CG-07 (CAL1) from TS-15. Claims: CC-01 for TS-05; CC-02 for TS-06; CC-03 for TS-11; CC-04 for TS-13; CC-05 for TS-16. Requirements: CSR-01 for CG-01; CSR-02 for CG-01, CG-06; CSR-03 for CG-02; CSR-04 for CG-02; CSR-05 for CG-03; CSR-06 for CG-03; CSR-07 for CG-04; CSR-08 for CG-04; CSR-09 for CG-04; CSR-10 for CG-05; CSR-11 for CG-06; CSR-12 for CG-07.</desc>
<style>
svg { --bg:#ffffff; --ink:#14171c; --ink2:#4b525c; --ink3:#868d97; --grid:#e2e5e9; --card:#f5f6f8; --amb:#b97800; --ambsoft:#fbf0d6; --ok:#23875a; --acc:#2d55c8; --accsoft:#e7ecfb; --bad:#b3261e; --badsoft:#fbe5e2; }
@media (prefers-color-scheme: dark) { svg { --bg:#16181c; --ink:#eceef1; --ink2:#b9bfc8; --ink3:#7f8792; --grid:#30343b; --card:#1f2227; --amb:#e7a52a; --ambsoft:#3a2e14; --ok:#45b882; --acc:#86a2ff; --accsoft:#232c48; --bad:#ff8b80; --badsoft:#3d1c1a; } }
svg .bg { fill:var(--bg); } svg .card { fill:var(--card); } svg .hair { stroke:var(--grid); stroke-width:1; fill:none; }
svg .h { font:600 20px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
svg .tb { font:600 13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
