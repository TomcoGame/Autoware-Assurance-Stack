svg .s { font:11.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink3); }
svg .m { font:500 12px ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill:var(--ink); }
svg .st-s { fill:var(--bg); stroke:var(--ink3); stroke-width:1.3; stroke-dasharray:4 3; }
svg .st-d { fill:var(--amb); }
svg .st-r { fill:var(--ambsoft); stroke:var(--amb); stroke-width:1.5; }
svg .st-a { fill:var(--ok); } svg .st-b { fill:var(--ok); stroke:var(--ink); stroke-width:1.6; }
svg .st-na { fill:var(--bg); stroke:var(--grid); stroke-width:1.2; stroke-dasharray:2 2; }
svg .goal { fill:var(--accsoft); stroke:var(--acc); stroke-width:1.4; }
svg .claim { fill:var(--card); stroke:var(--ink3); stroke-width:1.2; stroke-dasharray:4 3; }
svg .ts { fill:var(--card); stroke:var(--grid); stroke-width:1; }
svg .req { fill:var(--bg); stroke:var(--acc); stroke-width:1.2; }
svg .link { stroke:var(--ink3); stroke-width:1; fill:none; opacity:.7; }
svg .id { font:600 11px ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill:var(--ink); }
svg .cal { font:600 10.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--acc); }
svg .col { font:600 11px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink3); letter-spacing:.06em; }
</style>
