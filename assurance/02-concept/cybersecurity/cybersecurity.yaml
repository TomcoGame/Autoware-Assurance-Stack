# Cybersecurity goals, claims and concept for WP-C-10 (ISO/SAE 21434 §9.4, §9.5). cybersecurity.py checks the model
# against the TARA (../tara/tara.yaml): every threat that is reduced needs a goal, every retained one a claim,
# every goal a requirement, and every control the TARA proposed must be taken up. It writes the WP-C-10 tables and
# Figure 2-1. Every entry is a draft by Claude (I0).
#
# PUBLIC TIER. Attack vectors, risk values and the rationale of each claim are restricted (WP-M-09 §4) and kept
# outside this repository. Each goal's CAL is recorded here as the outcome of the restricted rating, taken from
# the impact and attack vector of its threats as ISO/SAE 21434 Annex E suggests.

goals:
  - id: CG-01
    text: Remote driving commands, assistance and releases act on a vehicle only when they come unaltered and fresh from an authorised operator
    threats: [TS-01, TS-02, TS-03]
    cal: CAL4
  - id: CG-02
    text: Losing the link to remote operations, by jamming or by flooding, does not strand vehicles; they still reach and leave minimal risk conditions safely
    threats: [TS-04]
    cal: CAL4
  - id: CG-03
    text: Only maps and models released through the controlled process, unaltered, are used in service
    threats: [TS-07]
    cal: CAL3
  - id: CG-04
    text: False sensor inputs made with known attack methods do not lead perception or localisation into unsafe behaviour
    threats: [TS-08, TS-09, TS-10]
    cal: CAL4
  - id: CG-05
    text: Passengers' trip data and cabin video are not disclosed to anyone without a need for them
    threats: [TS-12]
    cal: CAL4
  - id: CG-06
    text: A trip's destination or route changes only at the request of its passenger or an authorised operator, and the passenger is told
    threats: [TS-14]
    cal: CAL4
  - id: CG-07
    text: Commands from the passenger interface act only within their intended use
    threats: [TS-15]
    cal: CAL1

claims:
  - id: CC-01
    threats: [TS-05]
    controls: [CR-03]
  - id: CC-02
    threats: [TS-06]
    controls: []
  - id: CC-03
    threats: [TS-11]
    controls: [CR-09]
  - id: CC-04
    threats: [TS-13]
    controls: []
  - id: CC-05
    threats: [TS-16]
    controls: []

requirements:
  - id: CSR-01
    text: Sign remote driving, assistance and release messages end to end, from the operator station to the safety monitor, bound to one vehicle, with sequence numbers and time stamps; the monitor rejects any other
    goals: [CG-01]
    scope: item
    element: EL-02 Safety monitor; EL-09 Remote operations station
    from: [SR-02, FSR-08.01, FSR-08.03]
  - id: CSR-02
    text: Authenticate remote operators with phishing-resistant multi-factor authentication, give each the least privilege, log every action, and ask a second confirmation for releases and route changes
    goals: [CG-01, CG-06]
    scope: environment
    element: Remote operations centre
    from: [CR-01]
  - id: CSR-03
    text: Give each vehicle a second link to remote operations, independent of the first, and allow a field technician to release a vehicle locally when both are lost
    goals: [CG-02]
    scope: item
    element: EL-01 Autoware computer; remote operations
    from: [CR-02]
  - id: CSR-04
    text: Protect the remote operations backend against flooding, with capacity and filtering sized for the fleet
    goals: [CG-02]
    scope: environment
    element: Remote operations backend
    from: []
  - id: CSR-05
    text: Accept only updates signed with keys held in hardware, verify them before install, install them only out of service, and check software, map and model versions as one set
    goals: [CG-03]
    scope: item
    element: EL-01 Autoware computer; EL-02 Safety monitor
    from: [CR-04, SR-03]
  - id: CSR-06
    text: Change maps and training data only through reviewed, logged changes, with separation of duties between who changes and who releases
    goals: [CG-03]
    scope: environment
    element: Map and ML engineering (WP-W-10, WP-W-12)
    from: [CR-05]
  - id: CSR-07
    text: Test perception against the physical attacks on sensors and models known for the ODD, and keep the list current
    goals: [CG-04]
    scope: item
    element: EL-01 Autoware computer; EL-03 Safety perception channel
    from: [CR-06, FM-02]
  - id: CSR-08
    text: Cross-check the initial pose against the map and the last known pose before driving, and never take GNSS alone
    goals: [CG-04]
    scope: item
    element: EL-01 Autoware computer
    from: [CR-07, FM-09]
  - id: CSR-09
    text: Confirm an emergency vehicle by sound and light together before yielding, and report yields where no emergency vehicle is plausible
    goals: [CG-04]
    scope: item
    element: EL-01 Autoware computer
    from: [CR-08, FM-15]
  - id: CSR-10
    text: Encrypt trip data, cabin video and telemetry in transit and at rest, keep them only as long as needed, and give access by role
    goals: [CG-05]
    scope: environment
    element: Fleet backend
    from: [CR-10]
  - id: CSR-11
    text: Show any change of destination or route to the passenger, and act on it only when the passenger or an operator confirms it
    goals: [CG-06]
    scope: item
    element: EL-01 Autoware computer; passenger interface
    from: [CR-11]
  - id: CSR-12
    text: Accept from the passenger interface only the stop request and door commands, and let the vehicle's interlocks decide whether they act
    goals: [CG-07]
    scope: item
    element: EL-01 Autoware computer; EL-08 Door system
    from: [FSR-05.05, AOU-06, TR-16]
