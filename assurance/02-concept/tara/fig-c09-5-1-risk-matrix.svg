<svg xmlns="http://www.w3.org/2000/svg" width="640" height="466" viewBox="0 0 640 466" role="img" aria-labelledby="t d">
<title id="t">WP-C-09 Figure 5-1: threats on the risk matrix</title>
<desc id="d">Risk matrix with threat scenarios: TS-01 impact Severe, feasibility Low, risk 3; TS-02 impact Severe, feasibility Low, risk 3; TS-03 impact Severe, feasibility High, risk 5; TS-04 impact Severe, feasibility High, risk 5; TS-05 impact Severe, feasibility Very low, risk 2; TS-06 impact Severe, feasibility Very low, risk 2; TS-07 impact Severe, feasibility Medium, risk 4; TS-08 impact Severe, feasibility Low, risk 3; TS-09 impact Severe, feasibility High, risk 5; TS-10 impact Moderate, feasibility High, risk 3; TS-11 impact Severe, feasibility Very low, risk 2; TS-12 impact Major, feasibility Medium, risk 3; TS-13 impact Moderate, feasibility Medium, risk 2; TS-14 impact Severe, feasibility Medium, risk 4; TS-15 impact Moderate, feasibility High, risk 3; TS-16 impact Severe, feasibility Very low, risk 2.</desc>
<style>
