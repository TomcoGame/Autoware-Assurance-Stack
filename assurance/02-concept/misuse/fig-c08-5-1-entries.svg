<svg xmlns="http://www.w3.org/2000/svg" width="640" height="412" viewBox="0 0 640 412" role="img" aria-labelledby="t d">
<title id="t">WP-C-08 Figure 5-1: interactions and misuse by role</title>
<desc id="d">Entries by role: Passenger: MU-01 misuse, MU-02 misuse, MU-03 misuse (new requirement), MU-04 misuse, MU-05 misuse, MU-06 interaction (new requirement), MU-07 misuse (new requirement); Child, elderly or less mobile passenger: MU-08 interaction (new requirement), MU-09 misuse (new requirement); Pedestrian: MU-10 misuse, MU-11 interaction (new requirement), MU-12 misuse; Cyclist or scooter rider: MU-13 interaction; Driver of another vehicle: MU-14 misuse, MU-15 interaction; Remote operator: MU-16 error (new requirement), MU-17 error, MU-18 error, MU-19 error; First responder (police, fire, ambulance): MU-20 interaction (new requirement), MU-21 interaction (new requirement); Fleet technician: MU-22 error (new requirement), MU-23 misuse.</desc>
<style>
svg { --bg:#ffffff; --ink:#14171c; --ink2:#4b525c; --ink3:#868d97; --grid:#e2e5e9; --card:#f5f6f8; --amb:#b97800; --ambsoft:#fbf0d6; --ok:#23875a; --acc:#2d55c8; --accsoft:#e7ecfb; --bad:#b3261e; --badsoft:#fbe5e2; }
@media (prefers-color-scheme: dark) { svg { --bg:#16181c; --ink:#eceef1; --ink2:#b9bfc8; --ink3:#7f8792; --grid:#30343b; --card:#1f2227; --amb:#e7a52a; --ambsoft:#3a2e14; --ok:#45b882; --acc:#86a2ff; --accsoft:#232c48; --bad:#ff8b80; --badsoft:#3d1c1a; } }
svg .bg { fill:var(--bg); } svg .card { fill:var(--card); } svg .hair { stroke:var(--grid); stroke-width:1; fill:none; }
svg .h { font:600 20px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
svg .tb { font:600 13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
svg .t { font:13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink2); }
svg .s { font:11.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink3); }
svg .m { font:500 12px ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill:var(--ink); }
svg .st-s { fill:var(--bg); stroke:var(--ink3); stroke-width:1.3; stroke-dasharray:4 3; }
svg .st-d { fill:var(--amb); }
svg .st-r { fill:var(--ambsoft); stroke:var(--amb); stroke-width:1.5; }
svg .st-a { fill:var(--ok); } svg .st-b { fill:var(--ok); stroke:var(--ink); stroke-width:1.6; }
svg .st-na { fill:var(--bg); stroke:var(--grid); stroke-width:1.2; stroke-dasharray:2 2; }
svg .misuse { fill:var(--ambsoft); stroke:var(--amb); stroke-width:1.4; }
svg .error { fill:var(--badsoft); stroke:var(--bad); stroke-width:1.4; }
svg .interaction { fill:var(--accsoft); stroke:var(--acc); stroke-width:1.4; }
svg .chip { font:600 11px ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill:var(--ink); }
svg .dot { fill:var(--ink); }
</style>
