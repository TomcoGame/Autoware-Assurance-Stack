<svg xmlns="http://www.w3.org/2000/svg" width="824" height="754" viewBox="0 0 824 754" role="img" aria-labelledby="t d">
<title id="t">WP-C-04 Figure 2-1: safety view of the item architecture</title>
<desc id="d">Elements: EL-01 Autoware computer, inside the item, derived ASIL QM, 5 FSRs; EL-02 Safety monitor, inside the item, derived ASIL D, 22 FSRs; EL-03 Safety perception channel, inside the item, derived ASIL D, 2 FSRs; EL-04 Vehicle drive-by-wire, outside the item, derived ASIL D, 4 FSRs; EL-05 Park brake, outside the item, derived ASIL D, 1 FSRs; EL-06 Vehicle state sensing, outside the item, derived ASIL D, 2 FSRs; EL-07 Monitor power supply, outside the item, derived ASIL D, 1 FSRs; EL-08 Door system, outside the item, derived ASIL D, 1 FSRs; EL-09 Remote operations station, outside the item, derived ASIL C, 1 FSRs. Flows: Other road users to EL-03 (I-01); Autoware's sensors (EL-01) to EL-01 (I-02); EL-03 to EL-02 (I-13 detections); EL-01 to EL-02 (I-03 commands (QM)); HD map data to EL-01 (I-07); Update backend to EL-01 (I-10); Passengers to EL-01 (I-09); EL-09 to EL-02 (I-08 signed); EL-06 to EL-02 (I-05 state); EL-08 to EL-02 (door state); EL-02 to EL-05 (hold); EL-02 to EL-04 (I-04 bounded); EL-07 to EL-02 (I-12 power). Autoware's commands reach the drive-by-wire only through the safety monitor.</desc>
