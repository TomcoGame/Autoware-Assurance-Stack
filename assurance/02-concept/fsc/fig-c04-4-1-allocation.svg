<svg xmlns="http://www.w3.org/2000/svg" width="640" height="565" viewBox="0 0 640 565" role="img" aria-labelledby="t d">
<title id="t">WP-C-04 Figure 4-1: allocation of safety goals to elements</title>
<desc id="d">Functional safety requirements by safety goal and element: SG-01 (ASIL D): Autoware computer 1, Safety monitor 2, Vehicle drive-by-wire 1, Vehicle state sensing 1; SG-02 (ASIL D): Autoware computer 1, Safety monitor 2, Safety perception channel 1, Vehicle drive-by-wire 1; SG-03 (ASIL C): Safety monitor 2, Safety perception channel 1; SG-04 (ASIL D): Autoware computer 1, Safety monitor 3, Vehicle drive-by-wire 1, Vehicle state sensing 1; SG-05 (ASIL D): Safety monitor 3, Park brake 1, Door system 1; SG-06 (ASIL D): Autoware computer 1, Safety monitor 2; SG-07 (ASIL D): Autoware computer 1, Safety monitor 4, Vehicle drive-by-wire 1, Monitor power supply 1; SG-08 (ASIL C): Safety monitor 2, Remote operations station 1; SG-09 (ASIL C): Safety monitor 1. Element ASILs: Autoware computer QM, Safety monitor D, Safety perception channel D, Vehicle drive-by-wire D, Park brake D, Vehicle state sensing D, Monitor power supply D, Door system D, Remote operations station C.</desc>
