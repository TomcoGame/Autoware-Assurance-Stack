<svg xmlns="http://www.w3.org/2000/svg" width="640" height="622" viewBox="0 0 640 622" role="img" aria-labelledby="t d">
<title id="t">WP-C-01 Figure 5-1: item boundary and interfaces</title>
<desc id="d">Inside the item: Sensors, Autoware computer, Safety monitor. Outside: Vehicle platform, Power supply, HD map data, Update backend, Remote operations centre, Passengers, Other road users. Interfaces: I-01 from Other road users to Sensors; I-02 from Sensors to Autoware computer; I-03 from Autoware computer to Safety monitor; I-04 from Safety monitor to Vehicle platform; I-05 from Vehicle platform to Safety monitor; I-06 from Vehicle platform to Autoware computer; I-07 from HD map data to Autoware computer; I-08 from Remote operations centre to Autoware computer; I-09 from Passengers to Autoware computer; I-10 from Update backend to Autoware computer; I-11 from Vehicle platform to Other road users; I-12 from Power supply to Safety monitor; I-13 from Sensors to Safety monitor.</desc>
<style>
svg { --bg:#ffffff; --ink:#14171c; --ink2:#4b525c; --ink3:#868d97; --grid:#e2e5e9; --card:#f5f6f8; --amb:#b97800; --ambsoft:#fbf0d6; --ok:#23875a; --acc:#2d55c8; --accsoft:#e7ecfb; --bad:#b3261e; --badsoft:#fbe5e2; }
@media (prefers-color-scheme: dark) { svg { --bg:#16181c; --ink:#eceef1; --ink2:#b9bfc8; --ink3:#7f8792; --grid:#30343b; --card:#1f2227; --amb:#e7a52a; --ambsoft:#3a2e14; --ok:#45b882; --acc:#86a2ff; --accsoft:#232c48; --bad:#ff8b80; --badsoft:#3d1c1a; } }
svg .bg { fill:var(--bg); } svg .card { fill:var(--card); } svg .hair { stroke:var(--grid); stroke-width:1; fill:none; }
svg .h { font:600 20px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
svg .tb { font:600 13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
svg .t { font:13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink2); }
svg .s { font:11.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink3); }
svg .m { font:500 12px ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill:var(--ink); }
svg .st-s { fill:var(--bg); stroke:var(--ink3); stroke-width:1.3; stroke-dasharray:4 3; }
svg .st-d { fill:var(--amb); }
svg .st-r { fill:var(--ambsoft); stroke:var(--amb); stroke-width:1.5; }
svg .st-a { fill:var(--ok); } svg .st-b { fill:var(--ok); stroke:var(--ink); stroke-width:1.6; }
svg .st-na { fill:var(--bg); stroke:var(--grid); stroke-width:1.2; stroke-dasharray:2 2; }
svg .in { fill:var(--accsoft); stroke:var(--acc); stroke-width:1.6; }
svg .out { fill:var(--card); stroke:var(--ink3); stroke-width:1.2; }
svg .todo { fill:var(--bg); stroke:var(--acc); stroke-width:1.6; stroke-dasharray:5 3; }
svg .bound { fill:none; stroke:var(--acc); stroke-width:1.4; stroke-dasharray:7 5; }
svg .bl { font:600 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--acc); letter-spacing:.06em; }
svg .wire { stroke:var(--ink2); stroke-width:1.4; fill:none; }
svg .head { fill:var(--ink2); }
svg .ts { font:600 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
svg .iid { font:500 11px ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill:var(--ink2); }
</style>
