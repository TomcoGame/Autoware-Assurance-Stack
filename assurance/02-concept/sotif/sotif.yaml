# SOTIF hazard model for WP-C-05: hazardous behaviours caused by insufficiencies of the intended functionality,
# with no fault in the item. sotif.py checks the model against the functions of WP-C-01 §3 and the hazards of the
# HARA, decides which hazards need further evaluation (ISO 21448 §6: not when S0 or C0), and writes the WP-C-05
# tables and Figure 4-1. Controllability is C3 throughout, by the rule of DQ-015 B.
# Every entry is a draft by Claude (I0).

hazards:
  - id: SH-01
    behaviour: Does not detect a road user or obstacle in its path in time, and does not slow or stop
    insufficiency: performance
    functions: [F-02, F-06]
    hara: [H-02]
    harm: Collision with a pedestrian, cyclist or vehicle at up to 30 mph
    severity: S3
    controllability: C3
    triggers: Unusual shapes or postures (wheelchairs, children, people carrying objects), low light, glare, rain and spray, objects partly hidden, classes rare in the training data
    measures: Safety monitor's own detection (FSR-02.01, FSR-02.02); training data covering WP-C-02 §6
  - id: SH-02
    behaviour: Brakes hard for a road user or obstacle that is not there
    insufficiency: performance
    functions: [F-02, F-10]
    hara: [H-03]
    harm: Rear-end impact by a following vehicle or motorcycle
    severity: S2
    controllability: C3
    triggers: Spray, steam, exhaust plumes, blowing debris, reflections, overhanging foliage, LiDAR returns from rain
    measures: Monitor softens unconfirmed braking (FSR-03.02); false-positive limits on both channels (FSR-03.01)
  - id: SH-03
    behaviour: Reads a red or amber signal as green, or misses a signal, and enters the intersection
    insufficiency: performance
    functions: [F-03, F-06]
    hara: [H-06]
    harm: Side impact with crossing traffic or a crossing pedestrian
    severity: S3
    controllability: C3
    triggers: Sun behind the signal, LED flicker, occluded or damaged heads, signals for another lane or road, temporary signals, power outages
    measures: Unknown or unrecognised state treated as red (FSR-06.03); collision avoidance by the monitor (FSR-06.01); this is the rule part of SG-06 that DQ-017 A leaves to SOTIF
  - id: SH-04
    behaviour: Predicts another road user's motion wrongly and plans too little margin
    insufficiency: performance
    functions: [F-04, F-06]
    hara: [H-02, H-06]
    harm: Collision with a pedestrian stepping off the kerb, a cyclist swerving, or a vehicle running a red light
    severity: S3
    controllability: C3
    triggers: Pedestrians at the kerb looking at phones, jaywalking, cyclists between lanes, vehicles not stopping at their stop line
    measures: Monitor's bounds on others' motion (FSR-06.01); conservative prediction defaults (WP-C-07)
  - id: SH-05
    behaviour: Accepts too small a gap in an unprotected left turn or at a roundabout entry
    insufficiency: performance
    functions: [F-02, F-04, F-06]
    hara: [H-06]
    harm: Side impact with an oncoming or circulating vehicle at up to 30 mph
    severity: S3
    controllability: C3
    triggers: Oncoming vehicles hidden behind a turning vehicle, speed misestimated at range, motorcycles, vehicles accelerating
    measures: Monitor checks the swept path against detected vehicles (FSR-06.01) and occlusion speed limits (FSR-06.02)
  - id: SH-06
    behaviour: Localises itself in the wrong place on the map and drives out of its lane
    insufficiency: performance
    functions: [F-01, F-07]
    hara: [H-04]
    harm: Head-on or side impact, or a pedestrian struck on the sidewalk
    severity: S3
    controllability: C3
    triggers: Featureless streets, many new or moved objects since the map was made, large vehicles blocking the LiDAR view, heavy rain
    measures: Localisation confidence monitoring (MON-02); monitor's lateral check against detected obstacles and kerbs (FSR-04.01)
  - id: SH-07
    behaviour: Follows an HD map that no longer matches the road
    insufficiency: specification
    functions: [F-05, F-06]
    hara: [H-04, H-06]
    harm: Drives into a closed lane, against a changed traffic direction or through a work zone
    severity: S3
    controllability: C3
    triggers: Construction, re-marked lanes, new one-way streets, temporary closures not yet in the map
    measures: Map currency and change control (WP-W-12); map–world divergence monitor (MON-02)
  - id: SH-08
    behaviour: Does not notice it has left its ODD and keeps driving
    insufficiency: specification
    functions: [F-09]
    hara: [H-07]
    harm: Any collision under conditions the item was not validated for
    severity: S3
    controllability: C3
    triggers: Rain beyond 2.5 mm/h, fog below 200 m visibility, standing water, loss of the remote link, roads outside the geofence
    measures: ODD monitors MON-01 to MON-04 (WP-C-02 §4); MRM on any monitor that cannot decide
  - id: SH-09
    behaviour: Does not yield to an emergency vehicle with siren and lights
    insufficiency: specification
    functions: [F-02, F-06]
    hara: [H-06]
    harm: Collision with an emergency vehicle, or delay to its response
    severity: S3
    controllability: C3
    triggers: Any emergency vehicle approaching; the pinned Autoware has no siren detection or yielding manoeuvre (WP-C-02 OEDR-09)
    measures: Add siren and light detection and a yielding manoeuvre (WP-C-07)
  - id: SH-10
    behaviour: Ignores a police officer or flagger directing traffic
    insufficiency: specification
    functions: [F-02, F-06]
    hara: [H-06]
    harm: Collision in an intersection or work zone controlled by a person
    severity: S3
    controllability: C3
    triggers: Signal outages, events, crashes being cleared, work zones; no support in the pinned Autoware (WP-C-02 OEDR-10)
    measures: Detect a person directing traffic, stop and ask for remote assistance (MON-02, WP-C-07)
  - id: SH-11
    behaviour: Behaves in a way other road users do not expect (hesitates, stops without clear reason, blocks an intersection)
    insufficiency: specification
    functions: [F-06]
    hara: [H-03]
    harm: Rear-end impact, or another road user's evasive manoeuvre ending in a collision
    severity: S2
    controllability: C3
    triggers: Ambiguous objects, conservative gap acceptance, stops in lane after an MRM, waiting at a green light for an unseen hazard
    measures: Behaviour tuned against human driving data; stopped-vehicle signalling (WP-C-07)
  - id: SH-12
    behaviour: Enters a crosswalk or intersection at a speed that does not allow stopping for a road user emerging from behind an obstruction
    insufficiency: specification
    functions: [F-02, F-06]
    hara: [H-02, H-06]
    harm: Pedestrian or cyclist struck after emerging from behind a parked vehicle or bus
    severity: S3
    controllability: C3
    triggers: Parked vans and buses, queues of stopped traffic, hedges and walls at corners
    measures: Occlusion speed limits enforced by the monitor (FSR-06.02); Autoware's occlusion handling (OEDR-08)
  - id: SH-13
    behaviour: Is driven unsafely by a remote operator who cannot perceive the scene well enough
    insufficiency: performance
    functions: [F-11]
    hara: [H-08]
    harm: Collision during remote driving
    severity: S3
    controllability: C3
    triggers: Video delay and compression, limited field of view, no sound, operator workload across several vehicles
    measures: Monitor envelope applies to remote commands (FSR-08.02); remote operator qualification and limits (AOU-10, WP-O-02)
  - id: SH-14
    behaviour: The safety monitor's own perception misses a road user, or intervenes for one that is not there
    insufficiency: performance
    functions: [F-10]
    hara: [H-02, H-03]
    harm: Collision the monitor should have prevented, or an unjustified emergency stop
    severity: S3
    controllability: C3
    triggers: Low or thin objects, dark clothing at night for camera-free channels, spray and steam, sensor blockage by dirt or snow
    measures: Detection and false-positive targets for EL-03 (FSR-02.01, FSR-03.01); sensor blockage detection; dependent failure analysis with Autoware's sensors (WP-A-03)
  - id: SH-15
    behaviour: Pulls over during an MRM into an unsuitable place
    insufficiency: specification
    functions: [F-09]
    hara: []
    harm: Collision with a cyclist in a bike lane or a pedestrian at a driveway or crosswalk
    severity: S2
    controllability: C3
    triggers: Bike lanes at the kerb, driveways, bus stops, crosswalks, no suitable kerb within reach
    measures: Pull-over operator restricted to mapped safe stopping places (DQ-016 A, WP-C-01 OI-3)
  - id: SH-16
    behaviour: After stopping in lane, lets passengers step out into traffic
    insufficiency: specification
    functions: [F-09]
    hara: [H-07]
    harm: Passenger struck by a passing vehicle
    severity: S3
    controllability: C3
    triggers: Stop in lane as the rated minimal risk condition (DQ-016 A); passengers wanting to leave a stopped taxi
    measures: None that keeps the doors shut; they unlock at standstill by the lead's decision (DQ-023 C). Hazard lights, and passengers told to leave on the kerb side and watch for traffic (WP-O-03); the residual risk counts against AC-02

acceptance:
  - id: AC-01
    statement: The rate of injury crashes the item causes across its ODD does not exceed that of careful, competent human drivers on the same roads
    basis: DQ-020 A; the benchmark (published US crash data for urban streets at up to 30 mph, careful and competent drivers) is chosen and the validation target derived in WP-V-02
  - id: AC-02
    statement: For each SOTIF hazard needing further evaluation, its residual rate of hazardous behaviour is below the share of AC-01 allotted to it
    basis: Allotment in WP-V-02 once AC-01 is set
