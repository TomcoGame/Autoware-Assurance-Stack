  H-01:
    OS-01: [S3, A cyclist or pedestrian ahead struck at 40 km/h or more]
    OS-02: [S3, Acceleration from 24 km/h carries the vehicle past 40 km/h among pedestrians close to the kerb]
    OS-03: [S3, Accelerates into crossing traffic or pedestrians in the intersection]
    OS-04: [S3, Accelerates into the path of the oncoming vehicle]
    OS-05: [S2, Roundabout geometry keeps speeds near 32 km/h; angled impact]
    OS-06: [S3, Pulls away into pedestrians crossing in front]
    OS-07: [S3, Moves off with a person boarding or beside the vehicle]
    OS-08: [S2, Rear impact into the vehicle ahead at a small speed difference]
    OS-09: [S3, Pedestrian on the crosswalk struck at 40 km/h or more]
    OS-10: [S2, Accelerates beyond the remote driving limit of 10 km/h (DQ-032 A) into a road user nearby]
    OS-11: [S3, A pedestrian stepping out between parked vehicles struck at speed]
    OS-12: [S3, A child struck above the 32 km/h of a school zone]
