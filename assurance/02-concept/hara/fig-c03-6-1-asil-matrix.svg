<svg xmlns="http://www.w3.org/2000/svg" width="640" height="458" viewBox="0 0 640 458" role="img" aria-labelledby="t d">
<title id="t">WP-C-03 Figure 6-1: ASIL of each hazardous event</title>
<desc id="d">Hazardous events of WP-C-03 with their ASIL: HE-01.1 (H-01 in OS-06 Stopped in a queue or at a red light, pedestrians crossing in front): D; HE-01.2 (H-01 in OS-01 Driving in lane on an urban street): C; HE-02.1 (H-02 in OS-09 Approaching a crosswalk with pedestrians crossing): D; HE-02.2 (H-02 in OS-08 Following another vehicle in congested traffic): C; HE-03.1 (H-03 in OS-01 Driving in lane on an urban street): C; HE-03.2 (H-03 in OS-01 Driving in lane on an urban street): B; HE-04.1 (H-04 in OS-01 Driving in lane on an urban street): D; HE-04.2 (H-04 in OS-01 Driving in lane on an urban street): D; HE-04.3 (H-04 in OS-02 Driving slowly where pedestrians are dense): B; HE-05.1 (H-05 in OS-07 Stopped at a kerbside stop while passengers board or alight): D; HE-05.2 (H-05 in OS-06 Stopped in a queue or at a red light, pedestrians crossing in front): C; HE-06.1 (H-06 in OS-03 At a signalised intersection with cross traffic): D; HE-06.2 (H-06 in OS-04 Turning left across oncoming traffic without a protected phase): C; HE-06.3 (H-06 in OS-05 Entering or circulating in a roundabout): B; HE-06.4 (H-06 in OS-09 Approaching a crosswalk with pedestrians crossing): D; HE-07.1 (H-07 in OS-01 Driving in lane on an urban street): D; HE-08.1 (H-08 in OS-10 Driven by a remote operator): C; HE-09.1 (H-09 in OS-01 Driving in lane on an urban street): C; HE-10.1 (H-10 in OS-07 Stopped at a kerbside stop while passengers board or alight): C.</desc>
