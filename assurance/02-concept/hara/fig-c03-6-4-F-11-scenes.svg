<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="512" viewBox="0 0 1070 512" role="img" aria-labelledby="t d">
<title id="t">F-11 guide-word scenes</title>
<desc id="d">Guide-word scenes for F-11 Accept trips, mode changes and requests. M03 Unrequested function: A release or departure nobody asked for; the vehicle moves off from a stop (H-05). M07 Functions early: Departure before boarding is complete; as M03 (H-05, rated as M03). M12 Inverse function: A stop request taken as a start; as M03 (H-05, rated as M03).</desc>
