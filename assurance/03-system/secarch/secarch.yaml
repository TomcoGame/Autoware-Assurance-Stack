# Cybersecurity requirements and architecture model for WP-S-07 (ISO/SAE 21434 §10). secarch.py checks it against
# the cybersecurity concept (every item-level requirement of WP-C-10 is refined here, on a component of WP-S-03), the
# TARA (every threat reaches the item through an exposed interface), the hardware-software interface of WP-S-05
# (every interface that crosses a trust zone is a conduit with its controls) and the decision register. It derives
# each technical requirement's CAL from the goals of the requirement it refines, and writes the WP-S-07 tables and
# Figure 3-1.
# `controls` name technical cybersecurity requirements (CSTR), requirements on the environment (CSR of scope
# environment), controls the TARA proposed (CR) or safety mechanisms (SM).
# Every entry is a draft by Claude (I0). `pending` names a decision an entry waits on.

# Trust zones: each component of WP-S-03 belongs to exactly one. `box` places the zone in Figure 3-1.
zones:
  - id: SZ-1
    name: Off-board
    trust: Not trusted by the vehicle; everything it sends is authenticated
    components: [CMP-11]
    box: [24, 96, 132, 250]
  - id: SZ-2
    name: Autoware
    trust: Connected to the outside world; QM, and never in the rated path on its own
    components: [CMP-01]
    box: [172, 96, 132, 250]
  - id: SZ-3
    name: Safety
    trust: Trusted; no direct connection to the outside world; boots only signed software
    components: [CMP-02, CMP-03, CMP-04, CMP-05, CMP-10]
    box: [320, 96, 148, 250]
  - id: SZ-4
    name: Vehicle
    trust: Trusted to the extent its supplier shows; reachable only from the safety zone (CR-09)
    components: [CMP-06, CMP-07, CMP-08, CMP-09]
    box: [484, 96, 132, 250]

# Interfaces of WP-S-05 that cross a zone, and what protects them.
conduits:
  - interface: IF-01
    via: SZ-2
    controls: [CSTR-01.01, CSTR-01.02, CSTR-01.03]
    note: Tunnelled through the Autoware zone, which can delay or drop the commands but cannot forge or replay them
  - interface: IF-02
    controls: [CSTR-01.04, SM-01, SM-02, SM-05]
    note: The monitor accepts on this link only the messages of SIG-03 to SIG-05, and bounds whatever they say (CC-05)
  - interface: IF-06
    controls: [CR-09, CSTR-05.06]
    note: The by-wire bus carries commands only from the monitor (CC-03)
  - interface: IF-07
    controls: [CR-09, CSTR-05.06]
  - interface: IF-08
    controls: [CR-09, CSTR-05.06]
  - interface: IF-09
    controls: [CR-09, CSTR-05.06]

# Interfaces through which the item can be reached from outside the vehicle, or by someone with access to it.
external:
  - id: EX-01
    name: Cellular links to remote operations and the fleet backend
    zone: SZ-2
    vector: network
    threats: [TS-01, TS-02, TS-04, TS-06, TS-13, TS-14]
    controls: [CSTR-01.01, CSTR-01.02, CSTR-03.01, CSTR-03.02, CSTR-05.03, CSTR-11.01, CSR-04, CSR-10]
  - id: EX-02
    name: GNSS antenna and receiver
    zone: SZ-2
    vector: adjacent
    threats: [TS-09]
    controls: [CSTR-08.01]
  - id: EX-03
    name: The physical scene as the sensors and microphones receive it (light, radio, sound, markings)
    zone: SZ-2
    vector: adjacent
    threats: [TS-08, TS-10]
    controls: [CSTR-07.01, CSTR-07.02, CSTR-09.01]
  - id: EX-04
    name: Passenger interface (cabin screen, stop button) and the passenger app through the backend
    zone: SZ-2
    vector: local
    threats: [TS-14, TS-15]
    controls: [CSTR-11.01, CSTR-12.01, CSTR-12.02]
  - id: EX-05
    name: Service and debug ports (safety monitor, Autoware computer, vehicle diagnostic connector)
    zone: SZ-3
    vector: physical
    threats: [TS-05, TS-11, TS-16]
    controls: [CR-03, CSTR-05.01, CSTR-05.02, CSTR-05.05, CSTR-03.03, CSTR-05.07]
  - id: EX-06
    name: Remote operations centre and fleet backend, off-board
    zone: SZ-1
    vector: network
    threats: [TS-03, TS-07, TS-12]
    controls: [CSR-02, CSR-06, CSR-10]
  - id: EX-07
    name: Short-range wireless on the vehicle (Wi-Fi, Bluetooth)
    zone: SZ-2
    vector: adjacent
    threats: []
    controls: []
    pending: DQ-037

# Technical cybersecurity requirements, each refining an item-level requirement of WP-C-10.
# Those that come from the architecture itself (zones and conduits) refine the requirement whose goal the zone protects.
tcsrs:
  # CSR-01 Signed remote commands
  - id: CSTR-01.01
    csr: CSR-01
    component: CMP-11
    alloc: both
    text: Sign every remote driving command, assistance command and release with a key held in the station's hardware security module, bound to one vehicle's identity, with sequence number and time stamp (TSR-19.01)
    verify: Interface test; review of the key handling; penetration test of the station
  - id: CSTR-01.02
    csr: CSR-01
    component: CMP-02
    alloc: software
    text: Verify the signature of every remote message, and reject one for another vehicle, out of sequence, older than P-09 or with a bad signature, before any of its content is used (TSR-05.02, TSR-06.05)
    verify: Fault injection of forged, replayed, misaddressed and aged messages (WP-S-05 SIG-01, SIG-02); fuzzing of the message parser
  - id: CSTR-01.03
    csr: CSR-01
    component: CMP-02
    alloc: hardware
    text: Keep the verification keys and the vehicle identity in the hardware security module of the monitor's controller, readable only by the verification, and replaceable only through CSTR-05.01
    verify: Review of the controller's security manual (DQ-030 A); test that keys cannot be read out through EX-05

  # CSR-03 Second link and local release
  - id: CSTR-03.01
    csr: CSR-03
    component: CMP-01
    alloc: hardware
    text: Provide two cellular links on different networks, with separate modems and antennas, so that losing one network or one antenna leaves the other
    verify: Design review; field test with each link disabled
  - id: CSTR-03.02
    csr: CSR-03
    component: CMP-01
    alloc: software
    text: Detect the loss of each link, switch to the other, and report the loss of both as TR-11 (WP-C-12)
    verify: Test with each link and both links cut while driving
  - id: CSTR-03.03
    csr: CSR-03
    component: CMP-02
    alloc: software
    text: Accept a local release from a field technician only through an authenticated service tool on EX-05, with the release conditions of TSR-06.02, and log it
    verify: Test of the local release with valid and invalid credentials; review of the log

  # CSR-05 Signed updates and secure boot
  - id: CSTR-05.01
    csr: CSR-05
    component: CMP-02
    alloc: both
    text: Boot only firmware and envelope parameters signed with the project's release key, verified from immutable boot code; on a failed check stay silent, so that the vehicle does not move (MRM-5)
    verify: Test with unsigned, altered and old images; review of the boot chain
  - id: CSTR-05.02
    csr: CSR-05
    component: CMP-03
    alloc: both
    text: Boot only signed firmware on the safety channel processor and its safety island; on a failed check report itself failed (SIG-10)
    verify: Test with unsigned and altered images
  - id: CSTR-05.03
    csr: CSR-05
    component: CMP-01
    alloc: both
    text: Verify the boot chain of the Autoware computer, and verify every software, map and model package against its signature before install; install only out of service
    verify: Test with unsigned and altered packages; test that install is refused in service
  - id: CSTR-05.04
    csr: CSR-05
    component: CMP-01
    alloc: software
    text: Check at start that the software, map, model and parameter versions form one released set, and refuse to enter service otherwise
    verify: Test with each part of the set changed alone
  - id: CSTR-05.05
    csr: CSR-05
    component: CMP-02
    alloc: hardware
    text: Keep a monotonic counter in the controller that refuses older firmware and parameters than those installed
    verify: Rollback test

  # CSR-07 Physical attacks on perception
  - id: CSTR-07.01
    csr: CSR-07
    component: CMP-03
    alloc: software
    text: Include the known physical attacks on LiDAR and radar (spoofed returns, jamming, relays) in the detection and false-detection tests of TSR-09.01 to TSR-09.06, and report a sensor whose data is implausible as degraded (TSR-10.01)
    verify: Attack tests on the bench and on the track with the sensors chosen (WP-H-02)
  - id: CSTR-07.02
    csr: CSR-07
    component: CMP-01
    alloc: software
    text: Test Autoware's perception against the known adversarial patches and sensor attacks for the ODD, and keep the list current with the threat monitoring of WP-O-05
    verify: Attack tests in replay and on the track; review of the list

  # CSR-08 Pose initialisation
  - id: CSTR-08.01
    csr: CSR-08
    component: CMP-01
    alloc: software
    text: Accept an initial pose only when scan matching against the map and the last known pose agree with it; never take a GNSS fix alone
    verify: Tests with spoofed and displaced GNSS fixes at start-up

  # CSR-09 Emergency vehicles
  - id: CSTR-09.01
    csr: CSR-09
    component: CMP-01
    alloc: software
    text: Yield to an emergency vehicle only when sound and light confirm each other, and report every yield where no emergency vehicle is plausible to remote operations
    verify: Tests with siren only, lights only and both; review of the reports

  # CSR-11 Route changes
  - id: CSTR-11.01
    csr: CSR-11
    component: CMP-01
    alloc: software
    text: Accept a change of destination or route from the backend only when it is signed, show it to the passenger, and act on it only after the passenger or an operator confirms it
    verify: Tests with unsigned, unconfirmed and confirmed route changes

  # CSR-12 Passenger interface
  - id: CSTR-12.01
    csr: CSR-12
    component: CMP-01
    alloc: software
    text: Accept from the passenger interface and the passenger app only the stop request and door commands, rate-limited, and pass door commands to the door system without overriding its interlocks
    verify: Fuzzing of the passenger interface; tests with every other command
  - id: CSTR-12.02
    csr: CSR-12
    component: CMP-09
    alloc: hardware
    text: Act on a door command only within the door system's own interlocks, whatever the passenger interface sends (TSR-17.01)
    verify: Supplier evidence; vehicle test

  # Architecture: zones and conduits (CSR-01 and CSR-05)
  - id: CSTR-01.04
    csr: CSR-01
    component: CMP-02
    alloc: both
    text: Keep the link to the Autoware computer point to point, with no routing through the monitor, and accept on it only the messages of WP-S-05 SIG-03 to SIG-05; drop and count anything else
    verify: Fuzzing and flooding of IF-02; review of the network design
  - id: CSTR-05.06
    csr: CSR-05
    component: CMP-02
    alloc: both
    text: Be the only node of the safety and vehicle zones with a path to the Autoware zone, and forward nothing between them
    verify: Network review; test that no message from the Autoware computer reaches the by-wire bus
  - id: CSTR-05.07
    csr: CSR-05
    component: CMP-02
    alloc: hardware
    text: Close the monitor's debug ports in production, open them only with an authenticated unlock that erases the keys, and seal the housing (CR-03)
    verify: Test of the production debug state; inspection of the seal
