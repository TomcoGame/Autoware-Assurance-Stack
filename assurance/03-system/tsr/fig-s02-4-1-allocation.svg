<svg xmlns="http://www.w3.org/2000/svg" width="640" height="398" viewBox="0 0 640 398" role="img" aria-labelledby="t d">
<title id="t">WP-S-02 Figure 4-1: requirements per component</title>
<desc id="d">Technical safety requirements per component, by ASIL: CMP-02 Safety monitor controller: 19 at D, 5 at C; CMP-03 Safety channel processor: 2 at D, 2 at C; CMP-04 Safety LiDAR: 1 at C, 1 at B(D); CMP-05 Safety radar: 1 at C, 1 at B(D); CMP-06 Drive-by-wire (supplier): 5 at D; CMP-07 Vehicle state sensing (supplier): 3 at D; CMP-08 Park brake (supplier): 1 at D; CMP-09 Door system (supplier): 1 at D; CMP-10 Monitor power supply (supplier): 1 at D; CMP-11 Remote operations station (supplier): 1 at C.</desc>
<style>
svg { --bg:#ffffff; --ink:#14171c; --ink2:#4b525c; --ink3:#868d97; --grid:#e2e5e9; --card:#f5f6f8; --amb:#b97800; --ambsoft:#fbf0d6; --ok:#23875a; --acc:#2d55c8; --accsoft:#e7ecfb; --bad:#b3261e; --badsoft:#fbe5e2; }
@media (prefers-color-scheme: dark) { svg { --bg:#16181c; --ink:#eceef1; --ink2:#b9bfc8; --ink3:#7f8792; --grid:#30343b; --card:#1f2227; --amb:#e7a52a; --ambsoft:#3a2e14; --ok:#45b882; --acc:#86a2ff; --accsoft:#232c48; --bad:#ff8b80; --badsoft:#3d1c1a; } }
svg .bg { fill:var(--bg); } svg .card { fill:var(--card); } svg .hair { stroke:var(--grid); stroke-width:1; fill:none; }
svg .h { font:600 20px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
svg .tb { font:600 13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
svg .t { font:13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink2); }
svg .s { font:11.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink3); }
svg .m { font:500 12px ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill:var(--ink); }
svg .st-s { fill:var(--bg); stroke:var(--ink3); stroke-width:1.3; stroke-dasharray:4 3; }
svg .st-d { fill:var(--amb); }
svg .st-r { fill:var(--ambsoft); stroke:var(--amb); stroke-width:1.5; }
svg .st-a { fill:var(--ok); } svg .st-b { fill:var(--ok); stroke:var(--ink); stroke-width:1.6; }
svg .st-na { fill:var(--bg); stroke:var(--grid); stroke-width:1.2; stroke-dasharray:2 2; }
svg .a-d { fill:var(--bad); } svg .a-c { fill:var(--amb); }
svg .a-b { fill:var(--acc); } svg .a-bd { fill:var(--accsoft); stroke:var(--acc); stroke-width:1.4; }
svg .a-x { fill:var(--card); stroke:var(--ink3); stroke-width:1.2; }
svg .sup { fill:none; stroke:var(--ink3); stroke-width:1; stroke-dasharray:4 3; }
</style>
