<svg xmlns="http://www.w3.org/2000/svg" width="640" height="436" viewBox="0 0 640 436" role="img" aria-labelledby="t d">
<title id="t">WP-S-04 Figure 2-1: FTTI against fault size</title>
<desc id="d">FTTI against fault acceleration: SG-01, SG-02 with 0.5 m margin, from 707 ms at 2 m/s² to 500 ms at 4 m/s²; SG-04 with 0.3 m margin, from 775 ms at 1 m/s² to 447 ms at 3 m/s²; SG-05 with 0.2 m margin, from 894 ms at 0.5 m/s² to 516 ms at 1.5 m/s².</desc>
<style>
