<svg xmlns="http://www.w3.org/2000/svg" width="640" height="488" viewBox="0 0 640 488" role="img" aria-labelledby="t d">
<title id="t">WP-S-05 Figure 1-1: signal timeouts</title>
<desc id="d">Receive timeout and longest period of each timed signal: SIG-01 Remote driving command, 143 ms set by SM-05, sent at least every 48 ms; SIG-03 Control command, 143 ms set by SM-05, sent at least every 48 ms; SIG-05 Autoware heartbeat and state, 143 ms set by SM-05, sent at least every 48 ms; SIG-09 Obstacle and free-space report, 179 ms set by SM-02, sent at least every 60 ms; SIG-10 Safety channel status, 179 ms set by SM-03, sent at least every 60 ms; SIG-11 Bounded motion command, 179 ms set by SM-14, sent at least every 60 ms; SIG-12 Propulsion cut and brake switch, 179 ms set by SM-03, sent at least every 60 ms; SIG-13 Drive-by-wire status, 179 ms set by SM-03, sent at least every 60 ms; SIG-14 Longitudinal vehicle state, 179 ms set by SM-03, sent at least every 60 ms; SIG-15 Steering and gear state, 179 ms set by SM-03, sent at least every 60 ms; SIG-07 LiDAR point cloud, 200 ms set by SM-09, sent at least every 67 ms; SIG-08 Radar detections, 200 ms set by SM-09, sent at least every 67 ms.</desc>
<style>
svg { --bg:#ffffff; --ink:#14171c; --ink2:#4b525c; --ink3:#868d97; --grid:#e2e5e9; --card:#f5f6f8; --amb:#b97800; --ambsoft:#fbf0d6; --ok:#23875a; --acc:#2d55c8; --accsoft:#e7ecfb; --bad:#b3261e; --badsoft:#fbe5e2; }
@media (prefers-color-scheme: dark) { svg { --bg:#16181c; --ink:#eceef1; --ink2:#b9bfc8; --ink3:#7f8792; --grid:#30343b; --card:#1f2227; --amb:#e7a52a; --ambsoft:#3a2e14; --ok:#45b882; --acc:#86a2ff; --accsoft:#232c48; --bad:#ff8b80; --badsoft:#3d1c1a; } }
svg .bg { fill:var(--bg); } svg .card { fill:var(--card); } svg .hair { stroke:var(--grid); stroke-width:1; fill:none; }
svg .h { font:600 20px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
svg .tb { font:600 13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
svg .t { font:13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink2); }
svg .s { font:11.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink3); }
svg .m { font:500 12px ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill:var(--ink); }
svg .st-s { fill:var(--bg); stroke:var(--ink3); stroke-width:1.3; stroke-dasharray:4 3; }
svg .st-d { fill:var(--amb); }
svg .st-r { fill:var(--ambsoft); stroke:var(--amb); stroke-width:1.5; }
svg .st-a { fill:var(--ok); } svg .st-b { fill:var(--ok); stroke:var(--ink); stroke-width:1.6; }
svg .st-na { fill:var(--bg); stroke:var(--grid); stroke-width:1.2; stroke-dasharray:2 2; }
svg .to { fill:var(--accsoft); stroke:var(--acc); stroke-width:1.2; }
svg .pe { stroke:var(--amb); stroke-width:2.6; fill:none; }
svg .pd { fill:var(--amb); }
</style>
