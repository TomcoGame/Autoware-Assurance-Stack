<svg xmlns="http://www.w3.org/2000/svg" width="640" height="502" viewBox="0 0 640 502" role="img" aria-labelledby="t d">
<title id="t">03-system: work products by gate and status</title>
<desc id="d">Work products of 03-system from WP-M-00 §3, with the gates they are needed for and their status: WP-S-01 System requirements specification: G2, Skeleton; WP-S-02 Technical safety requirements specification: G2, Skeleton; WP-S-03 Technical safety concept and system architectural design: G2, Draft; WP-S-04 Timing: FTTI, detection and reaction budget, fallback timing: G2, Skeleton; WP-S-05 Hardware-software interface, including the drive-by-wire interface: G2, Skeleton; WP-S-06 Requirements for production, operation, service and decommissioning: G2, Skeleton; WP-S-07 Cybersecurity requirements and architectural design: G2, Skeleton; WP-S-08 System integration and test strategy, specification and report: G4, Skeleton; WP-S-09 System verification specification and report: G4, Skeleton.</desc>
