<svg xmlns="http://www.w3.org/2000/svg" width="640" height="622" viewBox="0 0 640 622" role="img" aria-labelledby="t d">
<title id="t">05-software: work products by gate and status</title>
<desc id="d">Work products of 05-software from WP-M-00 §3, with the gates they are needed for and their status: WP-W-01 Software development environment, languages and coding guidelines: G3, Skeleton; WP-W-02 Software safety requirements specification: G3, Skeleton; WP-W-03 Software architectural design (ROS 2 graph, executors, middleware): G3, Skeleton; WP-W-04 Software safety analysis and software-level DFA: G3, Skeleton; WP-W-05 Software unit design and implementation: G3, Skeleton; WP-W-06 Software unit verification: G3, Skeleton; WP-W-07 Software integration and verification: G4, Skeleton; WP-W-08 Testing of the embedded software: G4, Skeleton; WP-W-09 Safety-related configuration and calibration data (parameters, vehicle description): G3, Skeleton; WP-W-10 ML engineering: data, training, testing and deployment of models: G3, Skeleton; WP-W-11 Cybersecurity implementation and verification: G3, Skeleton; WP-W-12 HD map data (Lanelet2 and point cloud): requirements, production, verification: G3, Skeleton.</desc>
