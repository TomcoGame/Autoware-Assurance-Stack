<svg xmlns="http://www.w3.org/2000/svg" width="640" height="522" viewBox="0 0 640 522" role="img" aria-labelledby="t d">
<title id="t">Lifecycle of a decision register question</title>
<desc id="d">States: queued: Recorded, not asked yet; open: Asked, in a numbered batch; answered: The lead picked an option, on the inbox page or in chat; assumed: An easy question had no answer by proceed_after, so Claude went ahead with the recommended option; applied: The change is made; withdrawn: The question no longer applies. Transitions: queued to open (asked in a batch); open to answered (lead picks); open to assumed (easy, no answer); answered to applied (change made); assumed to applied (change made); any state to withdrawn. A hard question is never assumed, and never applied without the lead's answer.</desc>
<style>
svg { --bg:#ffffff; --ink:#14171c; --ink2:#4b525c; --ink3:#868d97; --grid:#e2e5e9; --card:#f5f6f8; --amb:#b97800; --ambsoft:#fbf0d6; --ok:#23875a; --acc:#2d55c8; --accsoft:#e7ecfb; --bad:#b3261e; --badsoft:#fbe5e2; }
@media (prefers-color-scheme: dark) { svg { --bg:#16181c; --ink:#eceef1; --ink2:#b9bfc8; --ink3:#7f8792; --grid:#30343b; --card:#1f2227; --amb:#e7a52a; --ambsoft:#3a2e14; --ok:#45b882; --acc:#86a2ff; --accsoft:#232c48; --bad:#ff8b80; --badsoft:#3d1c1a; } }
svg .bg { fill:var(--bg); } svg .card { fill:var(--card); } svg .hair { stroke:var(--grid); stroke-width:1; fill:none; }
svg .h { font:600 20px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
svg .tb { font:600 13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
svg .t { font:13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink2); }
svg .s { font:11.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink3); }
svg .m { font:500 12px ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill:var(--ink); }
svg .st-s { fill:var(--bg); stroke:var(--ink3); stroke-width:1.3; stroke-dasharray:4 3; }
svg .st-d { fill:var(--amb); }
svg .st-r { fill:var(--ambsoft); stroke:var(--amb); stroke-width:1.5; }
svg .st-a { fill:var(--ok); } svg .st-b { fill:var(--ok); stroke:var(--ink); stroke-width:1.6; }
svg .st-na { fill:var(--bg); stroke:var(--grid); stroke-width:1.2; stroke-dasharray:2 2; }
svg .box { fill:var(--card); stroke:var(--ink3); stroke-width:1.2; }
svg .box-lead { fill:var(--accsoft); stroke:var(--acc); stroke-width:1.6; }
svg .box-done { fill:var(--card); stroke:var(--ok); stroke-width:1.8; }
svg .edge { stroke:var(--ink3); stroke-width:1.4; fill:none; }
svg .edge-any { stroke:var(--ink3); stroke-width:1.2; fill:none; stroke-dasharray:4 4; }
svg .head { fill:var(--ink3); }
svg .rule { fill:var(--badsoft); }
svg .rule-t { font:600 13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--bad); }
</style>
<rect class="bg" width="640" height="522"/>
<text x="24" y="32" class="h">Lifecycle of a question</text>
<text x="24" y="54" class="t">States of the register (README table); dashed: from any state</text>
<line x1="288" y1="134" x2="288" y2="167" class="edge"/>
<path d="M288 174 L292 167 L284 167 Z" class="head"/>
<text x="298" y="158" class="s">asked in a batch</text>
<line x1="249.5" y1="232" x2="202.1" y2="267.8" class="edge"/>
<path d="M196.5 272 L204.5 271 L199.7 264.6 Z" class="head"/>
<text x="213" y="256" class="s" text-anchor="end">lead picks</text>
<line x1="326.5" y1="232" x2="373.9" y2="267.8" class="edge"/>
<path d="M379.5 272 L376.3 264.6 L371.5 271 Z" class="head"/>
<text x="363" y="256" class="s">easy, no answer</text>
<line x1="196.5" y1="330" x2="243.9" y2="365.8" class="edge"/>
<path d="M249.5 370 L246.3 362.6 L241.5 369 Z" class="head"/>
<text x="213" y="354" class="s" text-anchor="end">change made</text>
<line x1="379.5" y1="330" x2="332.1" y2="365.8" class="edge"/>
<path d="M326.5 370 L334.5 369 L329.7 362.6 Z" class="head"/>
<text x="343" y="354" class="s" text-anchor="end">change made</text>
<line x1="386" y1="125.9" x2="413.2" y2="131.7" class="edge-any"/>
<path d="M420 133.1 L414 127.8 L412.3 135.6 Z" class="head"/>
<line x1="386" y1="182.1" x2="413.2" y2="176.3" class="edge-any"/>
<path d="M420 174.9 L412.3 172.4 L414 180.2 Z" class="head"/>
<line x1="437.7" y1="272" x2="494.3" y2="188.8" class="edge-any"/>
<path d="M498.3 183 L491 186.5 L497.6 191 Z" class="head"/>
<rect x="190" y="76" width="196" height="58" rx="8" class="box"/>
<text x="200" y="96" class="m">queued</text>
<text x="200" y="113" class="s">Recorded, not asked yet</text>
<rect x="190" y="174" width="196" height="58" rx="8" class="box"/>
<text x="200" y="194" class="m">open</text>
<text x="200" y="211" class="s">Asked, in a numbered batch</text>
<rect x="60" y="272" width="196" height="58" rx="8" class="box-lead"/>
<text x="70" y="292" class="m">answered</text>
<text x="70" y="309" class="s">The lead picked an option, on</text>
<text x="70" y="322" class="s">the inbox page or in chat</text>
<rect x="320" y="272" width="196" height="58" rx="8" class="box"/>
<text x="330" y="292" class="m">assumed</text>
<text x="330" y="309" class="s">An easy question had no answer</text>
<text x="330" y="322" class="s">by proceed_after</text>
<rect x="190" y="370" width="196" height="58" rx="8" class="box-done"/>
<text x="200" y="390" class="m">applied</text>
<text x="200" y="407" class="s">The change is made</text>
<rect x="420" y="125" width="196" height="58" rx="8" class="box"/>
<text x="430" y="145" class="m">withdrawn</text>
<text x="430" y="162" class="s">The question no longer applies</text>
<rect x="24" y="454" width="592" height="52" rx="6" class="rule"/>
<text x="36" y="475" class="rule-t">A hard question is never assumed, and never applied without the lead's</text>
<text x="36" y="493" class="rule-t">answer.</text>
</svg>
