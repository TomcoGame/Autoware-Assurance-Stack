<svg xmlns="http://www.w3.org/2000/svg" width="640" height="479" viewBox="0 0 640 479" role="img" aria-labelledby="t d">
<title id="t">DQ-034: following distance for each option</title>
<desc id="d">Following distance the safety monitor keeps behind a vehicle at the same speed, from 0 to 50 km/h, for each option of DQ-034. A (Cautious, the vehicle ahead may brake as hard as a car can): vehicle ahead braking at 8 m/s², 19.5 m at 50 km/h. B (Typical, the vehicle ahead brakes firmly at most): vehicle ahead braking at 6 m/s², 15.5 m at 50 km/h. C (Minimal, the vehicle ahead brakes no harder than ours): vehicle ahead braking at 4 m/s², 7.4 m at 50 km/h. Assumes a 0.5 s response, 4 m/s² of own braking and a 0.5 m margin.</desc>
<style>
svg { --bg:#ffffff; --ink:#14171c; --ink2:#4b525c; --ink3:#868d97; --grid:#e2e5e9; --card:#f5f6f8; --amb:#b97800; --ambsoft:#fbf0d6; --ok:#23875a; --acc:#2d55c8; --accsoft:#e7ecfb; --bad:#b3261e; --badsoft:#fbe5e2; }
@media (prefers-color-scheme: dark) { svg { --bg:#16181c; --ink:#eceef1; --ink2:#b9bfc8; --ink3:#7f8792; --grid:#30343b; --card:#1f2227; --amb:#e7a52a; --ambsoft:#3a2e14; --ok:#45b882; --acc:#86a2ff; --accsoft:#232c48; --bad:#ff8b80; --badsoft:#3d1c1a; } }
svg .bg { fill:var(--bg); } svg .card { fill:var(--card); } svg .hair { stroke:var(--grid); stroke-width:1; fill:none; }
svg .h { font:600 20px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
svg .tb { font:600 13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
svg .t { font:13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink2); }
svg .s { font:11.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink3); }
svg .m { font:500 12px ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill:var(--ink); }
svg .st-s { fill:var(--bg); stroke:var(--ink3); stroke-width:1.3; stroke-dasharray:4 3; }
svg .st-d { fill:var(--amb); }
svg .st-r { fill:var(--ambsoft); stroke:var(--amb); stroke-width:1.5; }
svg .st-a { fill:var(--ok); } svg .st-b { fill:var(--ok); stroke:var(--ink); stroke-width:1.6; }
svg .st-na { fill:var(--bg); stroke:var(--grid); stroke-width:1.2; stroke-dasharray:2 2; }
svg .qm { fill:var(--card); stroke:var(--ink3); stroke-width:1.2; }
svg .safe { fill:var(--accsoft); stroke:var(--acc); stroke-width:1.8; }
svg .plat { fill:none; stroke:var(--ink3); stroke-width:1.2; stroke-dasharray:5 4; }
svg .arrow { stroke:var(--ink3); stroke-width:1.4; fill:none; }
svg .head { fill:var(--ink3); }
svg .reach-a { fill:var(--accsoft); stroke:var(--acc); stroke-width:1.8; }
svg .reach-b { fill:var(--ambsoft); stroke:var(--amb); stroke-width:1.6; }
svg .reach-c { fill:var(--card); stroke:var(--ink3); stroke-width:1.4; }
svg .fa { stroke:var(--acc); stroke-width:2.4; fill:none; }
svg .fb { stroke:var(--amb); stroke-width:2.4; fill:none; stroke-dasharray:7 4; }
svg .fc { stroke:var(--ink3); stroke-width:2.4; fill:none; stroke-dasharray:2 3; }
svg .ka { font:700 13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--acc); }
</style>
<rect class="bg" width="640" height="479"/>
<text x="24" y="32" class="h">How far back the monitor keeps the vehicle</text>
<text x="24" y="54" class="t">Following distance behind a vehicle at the same speed, for each option</text>
