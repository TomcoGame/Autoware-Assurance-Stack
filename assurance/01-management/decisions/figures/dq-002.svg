<path d="M112 248 L120 248 L116 254 Z" class="head"/>
<rect x="32" y="256" width="168" height="50" rx="7" class="safe"/>
<text x="116" y="276" class="tb" text-anchor="middle">Safety monitor</text>
<text x="116" y="293" class="s" text-anchor="middle">own hardware, can stop alo…</text>
<line x1="116" y1="308" x2="116" y2="321" class="arrow"/>
<path d="M112 320 L120 320 L116 326 Z" class="head"/>
<rect x="32" y="328" width="168" height="50" rx="7" class="qm"/>
<text x="116" y="358" class="tb" text-anchor="middle">Drive-by-wire</text>
<text x="116" y="402" class="t" text-anchor="middle">Separate safety monitor on</text>
<text x="116" y="418" class="t" text-anchor="middle">independent hardware</text>
<text x="310" y="100" class="tb" text-anchor="middle">B</text>
<rect x="216" y="104" width="188" height="138" rx="10" class="plat"/>
<rect x="226" y="112" width="168" height="50" rx="7" class="qm"/>
<text x="310" y="132" class="tb" text-anchor="middle">Planning, control</text>
<text x="310" y="149" class="s" text-anchor="middle">Autoware</text>
<line x1="310" y1="164" x2="310" y2="177" class="arrow"/>
<path d="M306 176 L314 176 L310 182 Z" class="head"/>
<rect x="226" y="184" width="168" height="50" rx="7" class="safe"/>
<text x="310" y="204" class="tb" text-anchor="middle">vehicle_cmd_gate</text>
<text x="310" y="221" class="s" text-anchor="middle">+ mrm_handler, rated</text>
<line x1="310" y1="236" x2="310" y2="249" class="arrow"/>
<path d="M306 248 L314 248 L310 254 Z" class="head"/>
<rect x="226" y="256" width="168" height="50" rx="7" class="qm"/>
<text x="310" y="286" class="tb" text-anchor="middle">Drive-by-wire</text>
<text x="310" y="402" class="t" text-anchor="middle">Rate vehicle_cmd_gate and</text>
<text x="310" y="418" class="t" text-anchor="middle">mrm_handler for safety on</text>
<text x="310" y="434" class="t" text-anchor="middle">the main computer</text>
<text x="504" y="100" class="tb" text-anchor="middle">C</text>
<rect x="410" y="104" width="188" height="138" rx="10" class="plat"/>
<rect x="420" y="112" width="168" height="50" rx="7" class="qm"/>
<text x="504" y="132" class="tb" text-anchor="middle">Planning, control</text>
<text x="504" y="149" class="s" text-anchor="middle">Autoware</text>
<line x1="504" y1="164" x2="504" y2="177" class="arrow"/>
<path d="M500 176 L508 176 L504 182 Z" class="head"/>
<rect x="420" y="184" width="168" height="50" rx="7" class="qm"/>
<text x="504" y="204" class="tb" text-anchor="middle">vehicle_cmd_gate</text>
<text x="504" y="221" class="s" text-anchor="middle">limits, mode select</text>
<line x1="504" y1="236" x2="504" y2="249" class="arrow"/>
<path d="M500 248 L508 248 L504 254 Z" class="head"/>
