<text x="504" y="276" class="tb" text-anchor="middle">Drive-by-wire</text>
<text x="504" y="293" class="s" text-anchor="middle">own limits, watchdog stop</text>
<text x="504" y="402" class="t" text-anchor="middle">Rely on the drive-by-wire</text>
