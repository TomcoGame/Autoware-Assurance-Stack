- id: DQ-009
  question: Where should the robotaxi first operate?
  context: >-
    The market sets the traffic rules the vehicle must follow, the permits it needs, what must be reported after a
    crash, and parts of the vehicle choice. The hazard analysis rates situations under one set of traffic rules,
    so **it needs one jurisdiction to rate against.** A second market later is an impact analysis.
  reversibility: hard
  blocks: Item definition §7, ODD (traffic rules), HARA operational situations
  gate: G1
  asked: 2026-10-23
  batch: 2
  options:
    - key: A
      recommended: true
      title: One US state
      detail: >-
        The chosen state's driverless testing and deployment permits, FMVSS for the vehicle and NHTSA crash reporting.
        Several states already have permit routes for driverless robotaxis. Cost: rules differ by state, so the state
        must be named; a vehicle without manual controls needs a federal exemption.
    - key: B
      title: The European Union
      detail: >-
        Type approval of the automated driving system under Regulation (EU) 2022/1426, plus UN R155 and R156 and a
        member state's national rules. Cost: approval covers small series only and asks for evidence close to this
        project's assurance case, which is a good fit but a long path.
    - key: C
      title: Japan
      detail: >-
        A Level 4 operating permit under the amended Road Traffic Act, issued for a defined route and operator.
        Cost: permits so far are for narrow routes and low speeds, which fits a 50 km/h urban ODD poorly.
  sources: [WP-C-01 §7, OI-2]
  status: applied
  answer: {choice: A, via: inbox, at: 2026-10-23, by: u_X1u501HWo3YGVNlzcvkvmg}
  applied: {ref: "#5", record: "WP-M-01 v0.3 §8; WP-C-01 v0.3 §7; WP-C-02 v0.3 §2, ODD-03; asked next as DQ-013", at: 2026-10-23}

- id: DQ-010
  question: May remote operators drive the vehicle, or only assist it?
  context: >-
    Autoware has a `REMOTE` operation mode in which a remote operator commands the vehicle. Remote driving makes the
    wireless link and the operator part of the control loop, so **link delay or loss while a person is driving
    becomes a hazard to rate and protect against.** Remote assistance (approve a route, release a stop, request an
    MRM) keeps the vehicle in control of its own motion.
  reversibility: revisit
  blocks: Item definition §4 and I-08, HARA, STPA control structure, TARA
  gate: G1
  asked: 2026-10-23
  batch: 2
  options:
    - key: A
      recommended: true
      title: Assistance only; no remote driving
      detail: >-
        Operators dispatch trips, approve routes, release a stopped vehicle and request a stop; the vehicle always
        plans and controls its own motion. Cost: a vehicle stuck where it cannot plan a way out needs a person on site.
    - key: B
      title: Remote driving at walking pace for recovery only
      detail: >-
        REMOTE mode allowed below a low speed limit enforced by the safety monitor, to move a stuck vehicle. Cost: the
        link and the operator station enter the safety case; the speed limit must be rated for safety.
    - key: C
      title: Remote driving in general
      detail: >-
        Operators may take over driving. Cost: link latency and loss, operator attention and the operator station
        become safety-critical; the largest addition to the hazard analysis and the TARA.
  sources: [WP-C-01 §4, OI-4, I-08, autoware_adapi_msgs 1.9.2 OperationModeState]
  status: applied
  answer: {choice: C, via: inbox, at: 2026-10-23, by: u_X1u501HWo3YGVNlzcvkvmg}
  applied: {ref: "#5", record: "WP-M-01 v0.3 §8; WP-C-01 v0.3 §4, I-08, AOU-10, §9; WP-C-02 v0.3 §2, ODD-15, MON-04, §5.1", at: 2026-10-23}

- id: DQ-011
  question: Should the first ODD include unprotected turns across oncoming traffic, and roundabouts?
  context: >-
    Turning across oncoming traffic without a protected signal phase, and entering roundabouts, both need the vehicle
    to judge gaps in fast cross traffic, which is where perception range and prediction errors matter most. Autoware
    has modules for both. **Leaving them out means the route planner avoids them**, at the cost of longer routes; a
    later release can add them through impact analysis.
  reversibility: revisit
  blocks: ODD-04, MAN-04, MAN-05, HARA operational situations
  gate: G1
  asked: 2026-10-23
  batch: 2
  options:
    - key: A
      recommended: true
      title: Leave both out of the first ODD
      detail: >-
        Routes use protected turns, right turns (left turns where traffic drives on the left) and stop-controlled
        junctions only. Cost: longer routes; some destinations in the geofence may be unreachable.
    - key: B
      title: Include unprotected turns, leave out roundabouts
      detail: >-
        Typical for a US city. Cost: gap acceptance against oncoming traffic up to the posted speed becomes a
        rated hazard and a large validation item.
    - key: C
      title: Include both
      detail: >-
        The fullest urban service. Cost: the largest hazard and validation scope of the three.
  sources: [WP-C-02 ODD-04, MAN-04, MAN-05, autoware_behavior_velocity_intersection_module, autoware_behavior_velocity_roundabout_module]
  status: applied
  answer: {choice: C, via: inbox, at: 2026-10-23, by: u_X1u501HWo3YGVNlzcvkvmg}
  applied: {ref: "#6", record: "WP-M-01 v0.4 §8; WP-C-02 v0.4 §2, ODD-04, MAN-04, MAN-05", at: 2026-10-23}

- id: DQ-012
  question: What are the weather and visibility limits of the ODD?
  context: >-
    You set the ODD to dry weather and light rain (DQ-001). The analyses need numbers. **Rain and spray degrade LiDAR
    and cameras together,** so the limit also bounds how much the perception can degrade before the vehicle must
    stop. The proposed numbers use the usual meteorological definition of light rain.
  reversibility: revisit
  blocks: ODD-10, ODD-11, MON-03, SOTIF triggering conditions
  gate: G1
  asked: 2026-10-23
  batch: 2
  options:
    - key: A
      recommended: true
      title: Rain up to 2.5 mm/h, visibility of 200 m or more
      detail: >-
        Light rain in the meteorological sense; fog, smoke or spray below 200 m is outside the ODD and the vehicle
        stops. Cost: the vehicle needs a way to estimate rain rate and visibility (MON-03).
    - key: B
      title: Dry roads only at first
      detail: >-
        Any rain ends service. Cost: narrower than what you chose in DQ-001; many service days lost in a wet city.
    - key: C
      title: Rain up to 7.6 mm/h, visibility of 100 m or more
      detail: >-
        Moderate rain. Cost: much more sensor degradation to characterise and validate; spray from other vehicles
        becomes a main triggering condition.
  sources: [WP-C-02 ODD-10, ODD-11, MON-03, DQ-001]
  status: applied
  answer: {choice: A, via: inbox, at: 2026-10-23, by: u_X1u501HWo3YGVNlzcvkvmg}
  applied: {ref: "#6", record: "WP-M-01 v0.4 §8; WP-C-02 v0.4 §2, ODD-10, ODD-11", at: 2026-10-23}

