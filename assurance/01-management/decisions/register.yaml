- id: DQ-006
  question: Should the upstream spell-check workflow stay off until the assurance tree has its own word list?
  context: >-
    Autoware's differential spell check uses the Autoware dictionaries, which do not know assurance terms such as
    FMEDA, SOTIF or STPA, so it would fail on most assurance pull requests.
  reversibility: easy
  blocks: Nothing
  decider: claude
  gate: G0
  asked: 2026-10-22
  proceed_after: 2026-10-22
  options:
    - key: A
      recommended: true
      title: Keep it off; re-enable it with a project word list later
      detail: The workflow file is kept under .github/workflows-disabled/ and can be moved back.
    - key: B
      title: Re-enable it now and ignore its failures
      detail: A permanently red check teaches everyone to ignore checks.
  sources: [.github/workflows-disabled/README.md]
  status: assumed
  answer: {choice: A, via: assumed, at: 2026-10-22}

