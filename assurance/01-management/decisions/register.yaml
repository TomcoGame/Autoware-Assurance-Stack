- id: DQ-026
  question: How assertively should the robotaxi drive?
  context: >-
    A vehicle that waits long and gives way to everyone causes its own collisions: drivers behind it lose patience,
    and others misread its hesitation (SH-11). A vehicle that takes gaps as people do accepts more risk at turns
    (SH-05). **This sets the default behaviour at junctions, merges and four-way stops, and how often the vehicle
    asks the remote operations centre for help.** The safety monitor bounds every option.
  reversibility: revisit
  blocks: WP-C-07 FM-17, planning parameters (WP-W-03)
  gate: G1
  asked: 2026-10-23
  batch: 7
  options:
    - key: A
      recommended: true
      title: At the cautious end of normal human driving, with a cap on waiting
      detail: >-
        Gaps and waits a careful driver would take; after a set time without a gap, it asks for remote assistance.
        Cost: tuning against data of human driving in the geofence, and more requests for assistance.
    - key: B
      title: As cautious as possible
      detail: >-
        Takes only large gaps and waits as long as needed. Cost: long waits, blocked traffic and more rear-end and
        frustration risk (SH-11).
    - key: C
      title: Like the typical driver in the geofence
      detail: >-
        Blends in best. Cost: accepts the gaps typical drivers do, which the acceptance criterion (careful,
        competent driver, DQ-020 A) does not support.
  sources: [WP-C-07 FM-17, WP-C-06 FI-15, TC-23, WP-C-05 SH-05, SH-11, DQ-020]
  status: applied
  answer: {choice: C, via: inbox, at: 2026-10-23, by: u_X1u501HWo3YGVNlzcvkvmg}
  applied: {ref: "#18", record: "WP-C-07 v0.3 FM-17, §4", at: 2026-10-23}

- id: DQ-027
  question: Which cybersecurity risks must the project reduce, rather than accept?
  context: >-
    The threat analysis gives each attack a risk value from 1 (lowest) to 5. Every risk the project does not reduce
    it accepts, with a written reason. **This sets how much cybersecurity work the vehicle and the remote operations
    centre need before driverless service, and is a risk acceptance only the safety authority can make.** With no
    driver, an attack that reaches vehicle control has no human to stop it.
  reversibility: revisit
  blocks: WP-C-09 §5 treatment, cybersecurity goals and CALs (WP-C-10), WP-S-07
  gate: G1
  asked: 2026-10-23
  batch: 8
  options:
    - key: A
      recommended: true
      title: Reduce every risk of 3 or more; accept 1 and 2 with a reason
      detail: >-
        Covers every attack that is both serious and reasonably feasible. Cost: in the current analysis 11 of 16
        threats need controls, among them operator accounts, the remote link, GNSS at start-up and fake sirens.
    - key: B
      title: Reduce every risk of 2 or more
      detail: >-
        Also covers attacks that are serious but very hard today, such as tampering with the safety monitor. Cost:
        nearly every threat needs controls; more hardware security and testing before service.
    - key: C
      title: Reduce only risks of 4 and 5
      detail: >-
        Least work before service. Cost: accepts forged remote commands and releases, sensor spoofing and fake
        sirens, which an assessor is unlikely to accept for a vehicle with no driver.
  sources: [WP-C-09 §5, ISO/SAE 21434 §15.9, UL 4600 §11]
  status: applied
  answer: {choice: A, via: inbox, at: 2026-10-23, by: u_X1u501HWo3YGVNlzcvkvmg}
  applied: {ref: "#21", record: WP-C-09 v0.3 §5, at: 2026-10-23}

- id: DQ-028
  question: Should the project train its own versions of Autoware's perception models, or use the published ones?
  context: >-
    The item uses three machine-learning models from the pinned Autoware (LiDAR object detection and two for traffic
    lights) and adds two of its own (sirens and emergency lights, DQ-025 A). ISO/PAS 8800 asks for evidence that the
    data each model learned from covers its input space (WP-C-02 §6). For the published models, that evidence is
    whatever their publishers released. **This sets whether the project runs its own data collection, labelling and
    training programme, which is one of its largest costs and lead times.**
  reversibility: hard
  blocks: WP-C-11 AISR-11 and AISR-12, ML engineering plan (WP-W-10), validation data (WP-V-02)
  gate: G1
  asked: 2026-10-23
  batch: 9
  options:
    - key: A
      recommended: true
      title: Fine-tune the published models on data collected and labelled in the geofence
      detail: >-
        Keeps Autoware's model architectures; adds data from the ODD so coverage can be measured and shown. Cost: a
        data collection and labelling programme before the first validation, and a model release process.
    - key: B
      title: Use the published models as they are, and validate them on data from the geofence
      detail: >-
        No training programme; only test data is collected. Cost: what the models learned cannot be shown to cover the
        ODD, only tested against it; gaps found in test cannot be fixed without moving to A.
    - key: C
      title: Replace them with a commercial perception stack
      detail: >-
        A supplier provides models and their evidence. Cost: licence, integration into Autoware, and dependence on the
        supplier's evidence meeting ISO/PAS 8800 for this ODD.
  sources: [WP-C-11 §5, ISO/PAS 8800, WP-C-02 §6, WP-C-06 §6]
  status: applied
  answer: {choice: A, via: inbox, at: 2026-10-23, by: u_X1u501HWo3YGVNlzcvkvmg}
  applied: {ref: "#26", record: "WP-C-11 v0.3 §5, AISR-11", at: 2026-10-23}

- id: DQ-029
  question: What should the robotaxi do when a passenger is not wearing a seat belt?
  context: >-
    With no driver, nobody in the vehicle tells passengers to buckle up, and the vehicle can brake hard at any time
    (its monitor may intervene, and an MRM can be an emergency stop). An unbelted passenger is the one most likely to be
    hurt by a hard stop. **This sets a default every passenger will meet, and how often trips are delayed.**
  reversibility: revisit
  blocks: WP-C-08 HR-03, passenger information (WP-O-03), vehicle seat belt sensing
  gate: G1
  asked: 2026-10-23
  batch: 9
  options:
    - key: A
      recommended: true
      title: Do not start until every occupied seat is belted; if one is unbuckled while driving, warn, then pull over
      detail: >-
        Starts only when belts are fastened; mid-trip it warns by voice and on screen, and pulls over (MRM-1) if the belt
        is not refastened within a short time. Cost: seat occupancy and belt sensing on every seat; some trips delayed or
        cut short.
    - key: B
      title: Do not start until every occupied seat is belted; only warn while driving
      detail: >-
        Same at the start; mid-trip only warnings. Cost: a passenger who unbuckles stays unbelted for the rest of the
        trip.
    - key: C
      title: Only remind passengers to buckle up
      detail: >-
        Like most taxis today. Cost: no protection for unbelted passengers in a hard stop; harder to argue under UL 4600
        with no driver to insist.
  sources: [WP-C-08 MU-07, HR-03, WP-C-12, FSR-03.02]
  status: applied
  answer: {choice: B, via: inbox, at: 2026-10-23, by: u_X1u501HWo3YGVNlzcvkvmg}
  applied: {ref: "#26", record: "WP-C-08 v0.3 §5, HR-03", at: 2026-10-23}

- id: DQ-030
  question: What hardware should the safety monitor run on?
  context: >-
    The safety monitor and its perception processor carry every ASIL D requirement of the item (WP-S-03). The
    monitor's logic is small; the perception processor must handle LiDAR and radar data in real time. Hardware that is
    already developed and assessed to ISO 26262 brings its own safety evidence; other hardware must be argued for from
    scratch. **This is the largest hardware cost of the safety architecture, and fixes the lead time of the monitor.**
  reversibility: hard
  blocks: WP-S-03 CMP-02 and CMP-03, hardware safety requirements (WP-H-01), WP-S-04 timing
  gate: G2
  asked: 2026-10-23
  batch: 10
  options:
    - key: A
      recommended: true
      title: An automotive ASIL D microcontroller for the monitor, and an automotive processor with a safety island for its perception
      detail: >-
        Both parts come with the supplier's safety manual and evidence. Cost: automotive parts, their development tools
        and lead times; the perception software must fit the processor's safety island and its budget.
    - key: B
      title: An industrial safety controller and an industrial PC
      detail: >-
        Quick to obtain and familiar from industrial machinery. Cost: their evidence is for IEC 61508, not ISO 26262; the
        mapping and the automotive environment (temperature, vibration, supply) must be argued and tested.
    - key: C
      title: One automotive processor for both, with the monitor on its safety island
      detail: >-
        Fewest parts. Cost: the monitor and its perception share a chip, so a common fault defeats both; the dependent
        failure analysis must show that cannot defeat SG-02.
  sources: [WP-S-03 §2, CMP-02, CMP-03, WP-C-04 EL-02, EL-03, ISO 26262-5]
  status: applied
