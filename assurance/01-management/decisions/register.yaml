  question: Should route planning prefer routes that avoid the hardest junctions?
  context: >-
    Unprotected left turns across several oncoming lanes and multi-lane roundabouts carry the most triggering
    conditions for gap acceptance (WP-C-06 TC-12, TC-13). Both stay inside the ODD (DQ-011 C); the question is only
    whether routing should avoid them when an alternative of similar length exists.
