- id: DQ-025
  question: How should the robotaxi know an emergency vehicle is coming?
  context: >-
    The pinned Autoware has no response to emergency vehicles (WP-C-06 FI-13), and the vehicle must pull aside or
    stop for one. An ambulance is often heard before it is seen, especially at a junction. **This decides what
    hardware the vehicle needs and how much the response depends on the remote operations centre.**
  reversibility: revisit
  blocks: WP-C-07 FM-15, sensor set (WP-H-02), WP-C-11
  gate: G2
  asked: 2026-10-23
  batch: 7
  options:
    - key: A
      recommended: true
      title: Microphones for sirens and cameras for emergency lights, on the vehicle
      detail: >-
        Hears sirens from any direction and confirms with the lights. Cost: a microphone array and a new detection
        model to build, train and validate; a new AI component under ISO/PAS 8800.
    - key: B
      title: Cameras for emergency lights only
      detail: >-
        Uses the existing cameras. Cost: misses an emergency vehicle that cannot yet be seen, for example behind
        buildings at a junction.
    - key: C
      title: The remote operator watches and listens, and tells the vehicle to yield
      detail: >-
        No new hardware. Cost: depends on the link, the video and the operator's attention (SH-13), and one
