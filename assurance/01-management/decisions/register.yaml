- id: DQ-017
  question: Should the right-of-way goal (SG-06, ASIL D) rest on collision avoidance rather than on traffic-rule compliance?
  context: >-
    SG-06 says the vehicle must not enter an intersection, roundabout or crosswalk against right of way. Checking that
    at ASIL D needs to know the light is red, which takes learned perception or infrastructure data. **The concept
    proposes that the safety monitor prevents the collision a violation would cause, with any road user its own
    sensors can see, and limits speed where it cannot see,** while obeying the rules stays with Autoware and is
    argued under SOTIF.
  reversibility: hard
  blocks: FSR-06.01 to FSR-06.03, the safety perception channel's design, technical safety concept
  gate: G1
  asked: 2026-10-23
  batch: 4
  options:
    - key: A
      recommended: true
      title: Collision avoidance at ASIL D; rule compliance QM with SOTIF argument
      detail: >-
        The monitor checks the swept path against detected road users and occlusions, with stated bounds on how
        others move. Cost: running an empty red light is not prevented at ASIL D; the assessor must accept that the
        rated goal is the collision, which matches what the HARA rated.
    - key: B
      title: Add an independent traffic-light channel to the monitor
      detail: >-
        A second camera and a diverse classifier, or signal phase data from the infrastructure, give the monitor its
        own view of the light. Cost: learned perception at ASIL D (ISO/PAS 8800), or dependence on equipped
        intersections the geofence may not have.
    - key: C
      title: Rate Autoware's traffic-light chain as well (decomposition)
      detail: >-
        Share SG-06 between Autoware and the monitor, for example ASIL B(D) each. Cost: reverses the decision to keep
        Autoware QM (DQ-002 A) for this chain.
  sources: [WP-C-04 §2.2, FSR-06.01, FSR-06.02, FSR-06.03, WP-C-03 SG-06, IEEE 2846-2022]
  status: applied
  answer: {choice: A, via: inbox, at: 2026-10-23, by: u_X1u501HWo3YGVNlzcvkvmg}
  applied: {ref: "#10", record: "WP-C-04 v0.3 §2.2, FSR-06.01 to FSR-06.03, OI-1; WP-M-01 v0.6 §8", at: 2026-10-23}

- id: DQ-018
  question: Should the safety monitor's perception have its own sensors?
  context: >-
    The safety perception channel detects road users for the monitor. If it uses Autoware's sensors, one sensor
    fault, a dirty lens or a mounting error can blind both the doer and the checker. **Own sensors make the two
    independent, at the cost of a second sensor set.** The vehicle is not chosen yet, so this sets a requirement on
    it rather than a part number.
  reversibility: hard
  blocks: Safety perception channel (EL-03), hardware design, dependent failure analysis, vehicle choice
  gate: G1
  asked: 2026-10-23
  batch: 4
  options:
    - key: A
      recommended: true
      title: Own sensors for the safety channel
      detail: >-
        For example radar at the corners and front plus one LiDAR, processed on the monitor's hardware. Cost: a
        second sensor set and its mounting, cleaning and calibration.
    - key: B
      title: Share Autoware's sensors, process independently
      detail: >-
        The monitor reads raw sensor data through its own interface. Cost: a common-cause failure path through the
        sensors that the dependent failure analysis must argue away, which is hard at ASIL D.
    - key: C
      title: Decide with the vehicle at G2
      detail: >-
        Keep both open. Cost: the technical safety concept and the hardware design wait until G2.
  sources: [WP-C-04 §2.3, FSR-02.01, EL-03, WP-A-03]
  status: applied
  answer: {choice: A, via: inbox, at: 2026-10-23, by: u_X1u501HWo3YGVNlzcvkvmg}
  applied: {ref: "#10", record: "WP-C-04 v0.3 §2.3, EL-03; WP-C-01 v0.6 §5.1 Sensors, I-13; WP-M-01 v0.6 §8", at: 2026-10-23}

- id: DQ-019
  question: May the safety monitor soften hard braking from Autoware that its own sensors cannot confirm?
  context: >-
    Unexpected hard braking is an ASIL C hazard (SG-03), and the monitor is the only rated element. But if Autoware
    brakes hard for something only it can see, softening that braking could let a collision happen. **Either the
    monitor softens unconfirmed hard braking, or SG-03 needs another rated mechanism.**
  reversibility: revisit
  blocks: FSR-03.02, SG-03 argument
  gate: G1
  asked: 2026-10-23
  batch: 4
  options:
    - key: A
      recommended: true
      title: Soften unconfirmed hard braking to a firm, non-emergency level
      detail: >-
        Braking above a comfortable level that the safety channel cannot match to an object is held to a firm level
        (to be set in WP-S-04). Cost: Autoware alone can no longer emergency-brake for an object the channel misses,
        so the channel's detection must be good enough to carry SG-02 by itself, which it must anyway.
    - key: B
      title: Never soften Autoware's braking
      detail: >-
        Every brake request passes unchanged. Cost: SG-03 has no rated mechanism; it would need ASIL decomposition or
        a rated part of Autoware's braking decision.
    - key: C
      title: Soften only above the maximum the vehicle should ever need in the ODD
      detail: >-
        Only clips extreme decelerations. Cost: spurious braking at just below that level, still hazardous for a
        following motorcycle, is not prevented.
  sources: [WP-C-04 §2.4, FSR-03.02, WP-C-03 SG-03, HE-03.1]
  status: applied
  answer: {choice: A, via: inbox, at: 2026-10-23, by: u_X1u501HWo3YGVNlzcvkvmg}
  applied: {ref: "#10", record: "WP-C-04 v0.3 §2.4, FSR-03.02; WP-M-01 v0.6 §8", at: 2026-10-23}

- id: DQ-020
  question: What residual risk will the project accept from the driverless robotaxi?
  context: >-
    The SOTIF analysis found sixteen ways the vehicle can cause harm with nothing broken, and all need further work.
    They are reduced, never removed, so the project must say how much risk is acceptable. **This sets how many
    miles and scenarios validation needs, which is the largest cost of the project.** With no driver, the usual
    yardstick is the risk of the same trips driven by people.
  reversibility: hard
  blocks: AC-01, validation targets (WP-V-02), the safety case's top claim (WP-M-01 §3.2)
  gate: G1
  asked: 2026-10-23
  batch: 5
  options:
    - key: A
      recommended: true
      title: At least as safe as a careful, competent human driver on the same roads
      detail: >-
        The injury-crash rate the vehicle causes must not exceed that of careful, competent drivers in the same ODD,
        from published US crash data chosen in WP-V-02. Cost: needs a credible benchmark for urban streets at up to
        30 mph, and enough driving to show the rate with statistical confidence.
    - key: B
      title: At least as safe as the average human driver
      detail: >-
        The benchmark is all drivers, including impaired and distracted ones. Cost: easier to show, but the public
        and an assessor are likely to call it too weak for a vehicle with no driver.
    - key: C
      title: A set factor safer than the average human driver (for example twice as safe)
      detail: >-
        Gives margin for the uncertainty in both rates. Cost: the most validation driving of the three.
  sources: [WP-C-05 §6, AC-01, WP-M-01 §3.2, ISO 21448 §6, UL 4600 §5]
  status: applied
  answer: {choice: A, via: inbox, at: 2026-10-23, by: u_X1u501HWo3YGVNlzcvkvmg}
  applied: {ref: "#12", record: "WP-C-05 v0.3 §6, AC-01; WP-M-01 v0.7 §3.2, §8", at: 2026-10-23}

- id: DQ-021
  question: What should the vehicle do when the safety monitor's own sensors fail?
  context: >-
    The safety monitor checks Autoware with its own sensors (DQ-018 A). If they fail or are blocked, nothing
    rated looks for road users until the vehicle has stopped, whichever way it stops: the monitor's own stop is
    rated but just as blind. **The choice is between a short comfortable stop by Autoware, which can still see,
    and a firmer immediate stop by the monitor, which cannot.**
  reversibility: revisit
  blocks: WP-C-12 TR-05, the monitor's fault reactions (WP-S-03), WP-S-04
  gate: G1
  asked: 2026-10-23
  batch: 6
  options:
    - key: A
      recommended: true
      title: Autoware stops in lane comfortably, the monitor watches its speed and braking
      detail: >-
        Autoware's comfortable stop, while the monitor checks speed, deceleration and steering from the vehicle's
        own signals and stops the vehicle itself if Autoware does not slow as expected. Cost: about 16 s and 120 m
        from 50 km/h (WP-C-12 §6) in which only Autoware looks for road users.
    - key: B
      title: The monitor stops the vehicle in lane at once
      detail: >-
        The monitor's own stop at its firm level. Cost: a harder stop with no one looking ahead or behind, so a
        higher rear-end risk (SG-03), and the stop is no better informed than Autoware's.
    - key: C
      title: Autoware pulls over to the next stopping place, the monitor watches its speed and braking
      detail: >-
        Ends at the kerb rather than in lane. Cost: the longest drive with no rated check on road users, and it
        needs the pull-over operator that does not exist yet.
  sources: [WP-C-12 §2 TR-05, WP-C-12 §6, FSR-02.01, WP-C-05 SH-14, WP-C-04 §6]
  status: applied
  answer: {choice: A, via: inbox, at: 2026-10-23, by: u_X1u501HWo3YGVNlzcvkvmg}
  applied: {ref: "#15", record: WP-C-12 v0.3 §2 TR-05; WP-C-04 v0.5 FSR-07.08, at: 2026-10-23}

- id: DQ-022
  question: Once the vehicle has started a minimal risk manoeuvre, may it call it off if the fault clears?
  context: >-
    Autoware's default is to cancel the manoeuvre and drive on as soon as the fault report clears. Even with its
    "emergency holding" option on, it only stays stopped after a fault that lasted 5 s. A fault that comes and goes
    is often the sign of a deeper one. **This sets how often the vehicle stops and waits for remote help, against
    the risk of driving on with an intermittent fault.** After the vehicle has stopped, only the remote operations
    centre can release it in every option (FSR-07.04).
  reversibility: revisit
  blocks: WP-C-12 §3 rules and Autoware's configuration, WP-S-04
  gate: G1
  asked: 2026-10-23
  batch: 6
  options:
    - key: A
      recommended: true
      title: Never; every manoeuvre runs to a stop
      detail: >-
        The vehicle always stops and waits for the remote operations centre. Cost: more stops in traffic and more
        work for remote operators; the simplest rule to argue and to test.
    - key: B
      title: Only if the fault clears within a short time set in WP-S-04, and it is reported
      detail: >-
        Brief glitches do not stop the vehicle. Cost: needs a list of which faults may clear themselves and evidence
        that they really are transient; more to argue.
    - key: C
      title: Whenever it clears (Autoware's default)
      detail: >-
        Fewest stops. Cost: an intermittent fault can make the vehicle stop and start repeatedly in traffic; hard
        to argue under SG-07.
  sources: [WP-C-12 §3, FSR-07.04, autoware_mrm_handler 0.52.1]
  status: applied
  answer: {choice: A, via: inbox, at: 2026-10-23, by: u_X1u501HWo3YGVNlzcvkvmg}
  applied: {ref: "#15", record: "WP-C-12 v0.3 §3.1, §3.2", at: 2026-10-23}

- id: DQ-023
  question: When the vehicle has stopped in its lane, may passengers get out?
  context: >-
    The rated minimal risk condition is a stop in lane (DQ-016 A), sometimes beside moving traffic. A passenger who
    steps out may be struck (SH-16). A passenger kept inside for long may be distressed, and after a crash or in a
    fire must be able to leave. **This sets the door rule at a stop in lane.**
  reversibility: revisit
  blocks: WP-C-12 MRC-2, WP-C-05 SH-16, WP-C-08, WP-O-03
  gate: G1
  asked: 2026-10-23
  batch: 6
  options:
    - key: A
      recommended: true
      title: Doors stay locked until the remote operations centre unlocks the kerb side
      detail: >-
        An operator checks the cameras, talks to the passengers, then unlocks the kerb-side doors; the vehicle's
        manual emergency release always works. Cost: needs a reliable voice link and a camera view of the kerb side,
        and passengers wait for an operator.
    - key: B
      title: Kerb-side doors unlock at standstill, the others stay locked
      detail: >-
        No wait for an operator. Cost: in a middle lane the kerb side faces another lane of traffic.
    - key: C
      title: All doors unlock at standstill, as in a taxi
      detail: >-
        Simplest for passengers. Cost: no protection against SH-16.
  sources: [WP-C-12 MRC-2, WP-C-05 SH-16, DQ-016]
  status: applied
  answer: {choice: C, via: inbox, at: 2026-10-23, by: u_X1u501HWo3YGVNlzcvkvmg}
  applied: {ref: "#15", record: WP-C-12 v0.3 §4 MRC-2; WP-C-05 v0.4 SH-16, at: 2026-10-23}

