<title id="t">Work products by gate and status (WP-M-00 Figure 3-1)</title>
<desc id="d">91 work products in 11 register sections. G0: 20 work products (2 draft, 18 skeleton). G1: 15 work products (12 draft, 3 skeleton). G2: 17 work products (6 draft, 11 skeleton). G3: 21 work products (21 skeleton). G4: 9 work products (1 draft, 8 skeleton). G5: 15 work products (15 skeleton). G6: 3 work products (3 skeleton). By section: 3.1 Management: WP-M-00 draft at G0, WP-M-01 draft at G0, WP-M-02 skeleton at G0, WP-M-03 skeleton at G0, WP-M-04 skeleton at G0, WP-M-05 skeleton at G0, WP-M-06 skeleton at G0, WP-M-07 skeleton at G0, WP-M-08 skeleton at G0, WP-M-09 skeleton at G0, WP-M-10 skeleton at G0, WP-M-11 skeleton at G0, WP-M-12 skeleton at G0, WP-M-13 skeleton at G0; 3.2 Concept phase: WP-C-01 draft at G1, WP-C-02 draft at G1, WP-C-03 draft at G1, WP-C-04 draft at G1, WP-C-05 draft at G1, WP-C-06 draft at G1, WP-C-07 draft at G1, WP-C-08 draft at G1, WP-C-09 draft at G1, WP-C-10 draft at G1, WP-C-11 draft at G1, WP-C-12 draft at G1; 3.3 System level: WP-S-01 skeleton at G2, WP-S-02 draft at G2, WP-S-03 draft at G2, WP-S-04 draft at G2, WP-S-05 draft at G2, WP-S-06 skeleton at G2, WP-S-07 skeleton at G2, WP-S-08 skeleton at G4, WP-S-09 skeleton at G4; 3.4 Hardware level: WP-H-01 skeleton at G3, WP-H-02 skeleton at G3, WP-H-03 skeleton at G3, WP-H-04 skeleton at G3, WP-H-05 skeleton at G3, WP-H-06 skeleton at G4, WP-H-07 skeleton at G3; 3.5 Software level: WP-W-01 skeleton at G3, WP-W-02 skeleton at G3, WP-W-03 skeleton at G3, WP-W-04 skeleton at G3, WP-W-05 skeleton at G3, WP-W-06 skeleton at G3, WP-W-07 skeleton at G4, WP-W-08 skeleton at G4, WP-W-09 skeleton at G3, WP-W-10 skeleton at G3, WP-W-11 skeleton at G3, WP-W-12 skeleton at G3; 3.6 Validation: WP-V-01 skeleton at G5, WP-V-02 skeleton at G2, WP-V-03 draft at G4, WP-V-04 skeleton at G5, WP-V-05 skeleton at G4, WP-V-06 skeleton at G5, WP-V-07 skeleton at G1, WP-V-08 draft at G2; 3.7 Supporting processes: WP-P-01 skeleton at G0, WP-P-02 skeleton at G0, WP-P-03 skeleton at G0, WP-P-04 skeleton at G0, WP-P-05 skeleton at G0, WP-P-06 skeleton at G0, WP-P-07 skeleton at G3, WP-P-08 skeleton at G3, WP-P-09 skeleton at G3, WP-P-10 skeleton at G5; 3.8 Safety analyses: WP-A-01 skeleton at G2, WP-A-02 skeleton at G2, WP-A-03 skeleton at G2, WP-A-04 skeleton at G2, WP-A-05 draft at G2; 3.9 Production, operation and decommissioning: WP-O-01 skeleton at G5, WP-O-02 skeleton at G5, WP-O-03 skeleton at G5, WP-O-04 skeleton at G6, WP-O-05 skeleton at G6, WP-O-06 skeleton at G2 (definition), G6 (monitoring); 3.10 Assurance cases and release: WP-K-01 skeleton at G1→G5 (living), WP-K-02 skeleton at G5, WP-K-03 skeleton at G5, WP-K-04 skeleton at G5, WP-K-05 skeleton at G5, WP-K-06 skeleton at G5, WP-K-07 skeleton at G5; 3.11 Traceability: WP-T-01 skeleton at G1→G5.</desc>
