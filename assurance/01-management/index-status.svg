<svg xmlns="http://www.w3.org/2000/svg" width="640" height="702" viewBox="0 0 640 702" role="img" aria-labelledby="t d">
<title id="t">01-management: work products by gate and status</title>
<desc id="d">Work products of 01-management from WP-M-00 §3, with the gates they are needed for and their status: WP-M-00 Work product register: G0, Draft; WP-M-01 Assurance strategy and lifecycle tailoring: G0, Draft; WP-M-02 Functional safety plan: G0, Skeleton; WP-M-03 Project plan (scope, WBS, schedule, resources): G0, Skeleton; WP-M-04 Organization, roles, competence and safety culture: G0, Skeleton; WP-M-05 Quality management and quality assurance plan: G0, Skeleton; WP-M-06 Confirmation measures plan (reviews, audit, assessment, independence): G0, Skeleton; WP-M-07 Project risk management plan and register: G0, Skeleton; WP-M-08 SOTIF plan: G0, Skeleton; WP-M-09 Cybersecurity plan: G0, Skeleton; WP-M-10 AI safety management plan (perception and prediction models): G0, Skeleton; WP-M-11 Upstream (Autoware Foundation) and supplier management, development interface agreements: G0, Skeleton; WP-M-12 Reuse and impact analysis of the Autoware baseline: G0, Skeleton; WP-M-13 ASPICE capability baseline (self-assessment): G0, Skeleton.</desc>
