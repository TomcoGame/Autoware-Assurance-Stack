<svg xmlns="http://www.w3.org/2000/svg" width="640" height="342" viewBox="0 0 640 342" role="img" aria-labelledby="t d">
<title id="t">08-analyses: work products by gate and status</title>
<desc id="d">Work products of 08-analyses from WP-M-00 §3, with the gates they are needed for and their status: WP-A-01 ASIL decomposition rationale: G2, Skeleton; WP-A-02 Coexistence of elements and freedom from interference: G2, Skeleton; WP-A-03 Dependent failure analysis: G2, Skeleton; WP-A-04 System-level safety analyses (FTA, FMEA): G2, Skeleton; WP-A-05 System-theoretic process analysis (STPA): G2, Draft.</desc>
