<svg xmlns="http://www.w3.org/2000/svg" width="640" height="542" viewBox="0 0 640 542" role="img" aria-labelledby="t d">
<title id="t">WP-A-05 Figure 3-1: control structure</title>
<desc id="d">Control structure: Map and update process to Autoware: CA-06 Install a map, software or model update; Remote operations centre to Autoware: CA-01 Dispatch a trip, CA-02 Request an MRM or an emergency stop, CA-03 Give remote assistance (confirm a path), CA-04 Drive the vehicle remotely; feedback: Trip and MRM status, camera video, vehicle state, requests for assistance; Remote operations centre to Safety monitor: CA-05 Release the vehicle from a minimal risk condition; Autoware to Safety monitor: CA-07 Command acceleration or braking, CA-08 Command steering, CA-09 Command the gear, CA-10 Command the turn indicators and hazard lights; feedback: Interventions and the monitor's state; Passengers to Vehicle: CA-14 Open a door, CA-15 Ask the vehicle to stop (in-vehicle stop request, relayed to Autoware through the AD API, I-09); feedback: Door state, trip status, messages from the vehicle and remote operations; Safety monitor to Vehicle: CA-11 Pass or bound the command, CA-12 Intervene (brake, cut propulsion, reject steering), CA-13 Apply and hold the park brake; feedback: Speed, steering angle, gear, by-wire faults, door state, collision signal; Vehicle to Autoware: feedback only; feedback: Speed, steering, gear, control mode, turn signal state.</desc>
<style>
svg { --bg:#ffffff; --ink:#14171c; --ink2:#4b525c; --ink3:#868d97; --grid:#e2e5e9; --card:#f5f6f8; --amb:#b97800; --ambsoft:#fbf0d6; --ok:#23875a; --acc:#2d55c8; --accsoft:#e7ecfb; --bad:#b3261e; --badsoft:#fbe5e2; }
@media (prefers-color-scheme: dark) { svg { --bg:#16181c; --ink:#eceef1; --ink2:#b9bfc8; --ink3:#7f8792; --grid:#30343b; --card:#1f2227; --amb:#e7a52a; --ambsoft:#3a2e14; --ok:#45b882; --acc:#86a2ff; --accsoft:#232c48; --bad:#ff8b80; --badsoft:#3d1c1a; } }
svg .bg { fill:var(--bg); } svg .card { fill:var(--card); } svg .hair { stroke:var(--grid); stroke-width:1; fill:none; }
svg .h { font:600 20px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
svg .tb { font:600 13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
svg .t { font:13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink2); }
svg .s { font:11.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink3); }
svg .m { font:500 12px ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill:var(--ink); }
svg .st-s { fill:var(--bg); stroke:var(--ink3); stroke-width:1.3; stroke-dasharray:4 3; }
svg .st-d { fill:var(--amb); }
svg .st-r { fill:var(--ambsoft); stroke:var(--amb); stroke-width:1.5; }
svg .st-a { fill:var(--ok); } svg .st-b { fill:var(--ok); stroke:var(--ink); stroke-width:1.6; }
svg .st-na { fill:var(--bg); stroke:var(--grid); stroke-width:1.2; stroke-dasharray:2 2; }
svg .box { fill:var(--accsoft); stroke:var(--acc); stroke-width:1.6; }
svg .ctl { stroke:var(--ink2); stroke-width:1.5; fill:none; }
svg .fbk { stroke:var(--ink3); stroke-width:1.3; fill:none; stroke-dasharray:5 3; }
svg .hd { fill:var(--ink2); } svg .hf { fill:var(--ink3); }
svg .lab { font:600 10.5px ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill:var(--ink2); }
</style>
