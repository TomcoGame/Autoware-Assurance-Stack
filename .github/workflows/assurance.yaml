name: assurance

# Checks of the assurance tree (assurance/): the decision register, the safety case records, the work-product
# headers, links and tables, that no restricted cybersecurity information is published (WP-M-09 §4), and every
# generated figure, page and block, each run with --check so a stale output fails. Read-only: the job never writes
# to the repository. Contributors run the generators and commit the result. Pull requests run it whatever they touch,
# so restricted information cannot come in through a file outside the assurance tree.

on:
  push:
    branches:
      - main
    paths:
      - assurance/**
      - wiki/**
      - CLAUDE.md
      - .gitignore
      - .github/workflows/assurance.yaml
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: assurance checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the checker dependency (PyYAML)
        run: python3 -m pip install --quiet --user --break-system-packages -r assurance/requirements.txt

      - name: Decision register follows its lifecycle; the inbox page builds
        run: |
          python3 assurance/01-management/decisions/check_decisions.py
          python3 assurance/01-management/decisions/build_inbox.py --out "$RUNNER_TEMP/inbox.html"

      - name: Safety case records follow their rules
        run: python3 assurance/case/tools/validate.py

      - name: Work-product headers agree with the register; links and tables are sound
        run: |
          python3 assurance/trace/tools/check_headers.py
          python3 assurance/trace/tools/check_links.py
          python3 assurance/trace/tools/check_tables.py

      - name: No restricted cybersecurity information is published (WP-M-09 §4)
        run: python3 assurance/trace/tools/check_restricted.py

      - name: Every generated output is current
        run: |
          python3 assurance/01-management/figures/fig_m00_register.py --check
          python3 assurance/01-management/figures/folder_index.py --check
          python3 assurance/01-management/decisions/fig_lifecycle.py --check
          python3 assurance/01-management/decisions/fig_questions.py --check
          python3 assurance/02-concept/figures/fig_c01_boundary.py --check
          python3 assurance/02-concept/hara/hara.py --check
          python3 assurance/02-concept/fsc/fsc.py --check
          python3 assurance/02-concept/sotif/sotif.py --check
          python3 assurance/02-concept/fallback/fallback.py --check
          python3 assurance/02-concept/triggering/triggering.py --check
          python3 assurance/02-concept/modifications/modifications.py --check
          python3 assurance/08-analyses/stpa/stpa.py --check
          python3 assurance/02-concept/tara/tara.py --check
          python3 assurance/02-concept/cybersecurity/cybersecurity.py --check
          python3 assurance/02-concept/ai/ai.py --check
          python3 assurance/02-concept/misuse/misuse.py --check
          python3 assurance/03-system/tsc/tsc.py --check
          python3 assurance/03-system/tsc/sysml.py --check
          python3 assurance/03-system/timing/timing.py --check
          python3 assurance/03-system/tsr/tsr.py --check
          python3 assurance/03-system/hsi/hsi.py --check
          python3 assurance/03-system/secarch/secarch.py --check
          python3 assurance/03-system/integ/integ.py --check
          python3 assurance/03-system/verif/verif.py --check
          python3 assurance/06-validation/scenarios/scenarios.py --check
          python3 assurance/06-validation/simenv/simenv.py --check
          python3 assurance/case/tools/dashboard.py --check

      - name: Unit tests of the tools
        run: python3 -m unittest discover -s assurance/tests -p 'test_*.py' -v
